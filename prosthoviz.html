<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05070b">
    <title>ProsthoMaster 3D Pro v6.0 | 口腔修复临床可视化系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans SC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #05070b;
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
            margin: 0;
        }
        #viewport-3d {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 46%, #182234 0%, #0b101b 58%, #040609 100%);
            z-index: 1;
        }
        #viewport-3d.pure-black {
            background: #020305;
        }
        .cad-panel {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.22);
            box-shadow: 0 18px 40px -12px rgba(0, 0, 0, 0.85);
        }
        .cad-btn {
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cad-btn:active {
            transform: scale(0.96);
        }
        input[type=range].timeline-slider {
            -webkit-appearance: none;
            background: transparent;
            height: 26px;
        }
        input[type=range].timeline-slider::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(90deg, #f59e0b 0%, #ef4444 35%, #38bdf8 68%, #10b981 100%);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.7);
        }
        input[type=range].timeline-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            border: 3px solid #0284c7;
            margin-top: -7px;
            cursor: grab;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
            transition: transform 0.15s ease;
        }
        input[type=range].timeline-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        .fdi-cell {
            transition: all 0.12s ease;
            cursor: pointer;
        }
        .fdi-cell:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        /* ================= MOBILE / TABLET RESPONSIVE LAYER ================= */
        #mobile-drawer-toggle, #mobile-drawer-backdrop { display: none; }
        #mobile-drawer-toggle {
            position: fixed;
            left: 12px;
            bottom: calc(150px + env(safe-area-inset-bottom, 0px));
            z-index: 46;
            width: 48px;
            height: 48px;
            border-radius: 999px;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.55);
            box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.95);
        }
        #mobile-drawer-backdrop {
            position: fixed;
            inset: 0;
            z-index: 44;
            background: rgba(2, 4, 8, 0.62);
            -webkit-backdrop-filter: blur(2px);
            backdrop-filter: blur(2px);
        }

        @media (max-width: 900px) {
            #mobile-drawer-toggle { display: flex; }
            body.drawer-open #mobile-drawer-backdrop { display: block; }

            /* --- Top toolbar: one horizontally scrollable row --- */
            header {
                top: max(4px, env(safe-area-inset-top, 0px)) !important;
                left: 4px !important;
                right: 4px !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                align-items: flex-start !important;
                pointer-events: auto !important;
                padding-bottom: 4px;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            header::-webkit-scrollbar { display: none; }
            header > div { flex: 0 0 auto !important; flex-wrap: nowrap !important; }
            header button { white-space: nowrap; }

            /* --- Left sidebar -> off-canvas drawer --- */
            aside {
                top: 0 !important;
                bottom: 0 !important;
                left: 0 !important;
                width: min(86vw, 340px) !important;
                max-height: 100dvh !important;
                height: 100dvh;
                padding: calc(12px + env(safe-area-inset-top, 0px)) 10px calc(16px + env(safe-area-inset-bottom, 0px)) 10px !important;
                background: rgba(3, 6, 12, 0.985) !important;
                border-right: 1px solid rgba(148, 163, 184, 0.18);
                transform: translateX(-112%) !important;
                transition: transform 0.26s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 45 !important;
                will-change: transform;
            }
            body.drawer-open aside { transform: translateX(0) !important; }

            /* --- Bottom dock: compact & full width --- */
            #bottom-dock {
                width: 97vw !important;
                bottom: max(6px, env(safe-area-inset-bottom, 0px)) !important;
                gap: 6px !important;
            }
            #timeline-bar { padding: 8px !important; gap: 8px !important; }
            #timeline-bar > div { width: 100% !important; gap: 6px; }
            #timeline-bar > div:first-child { flex-wrap: wrap !important; flex-shrink: 1 !important; }
            #timeline-bar button { padding: 6px 8px !important; }
            #timeline-status-label { width: auto !important; text-align: left; }
        }
    </style>
</head>
<body class="w-screen h-screen relative overflow-hidden">

    <!-- ================= FULLSCREEN 3D CLINICAL VIEWPORT ================= -->
    <div id="viewport-3d"></div>

    <!-- ================= 3D FDI FLOATING MICRO-LABELS OVERLAY ================= -->
    <div id="fdi-3d-labels-layer" class="fixed inset-0 pointer-events-none z-10 overflow-hidden"></div>

    <!-- ================= DRAGGABLE, RESIZABLE & CLOSABLE CLINICAL HAZARD FLOATING WINDOW ================= -->
    <div id="hazard-floating-banner" style="left: 50%; top: 68px; transform: translateX(-50%); width: min(92vw, 540px);" class="hidden fixed z-40 pointer-events-auto cad-panel rounded-2xl border-2 border-amber-500/60 shadow-2xl overflow-hidden select-none">
        <!-- Draggable Title Bar + Controls (Zoom In/Out & Close) -->
        <div id="hazard-banner-drag-handle" class="flex items-center justify-between gap-2 px-3.5 py-2 bg-slate-900/95 border-b border-slate-700/80 cursor-move">
            <div class="flex items-center gap-2 min-w-0">
                <i class="fa-solid fa-grip-vertical text-slate-400 text-xs shrink-0" title="按住此处可任意拖动窗口位置"></i>
                <div id="hazard-banner-title" class="text-sm font-extrabold text-amber-300 truncate flex items-center gap-1.5"></div>
            </div>
            <div class="flex items-center gap-1 shrink-0" onpointerdown="event.stopPropagation()">
                <button onclick="changeHazardBannerScale(-1)" class="cad-btn px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 text-xs font-bold" title="缩小文字与窗口">
                    A-
                </button>
                <button onclick="changeHazardBannerScale(1)" class="cad-btn px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-600 text-xs font-bold" title="放大文字与窗口">
                    A+
                </button>
                <button onclick="closeHazardFloatingBanner()" class="cad-btn px-2 py-0.5 rounded-lg bg-rose-950/90 hover:bg-rose-600 text-rose-200 hover:text-white border border-rose-500/50 text-xs font-bold ml-0.5" title="关闭文字说明窗口">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>
        <!-- Resizable Content Body -->
        <div class="p-3.5 bg-slate-950/85">
            <div id="hazard-banner-sub" class="text-base text-slate-100 leading-relaxed font-medium"></div>
            <div class="mt-2 pt-1.5 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-400">
                <span><i class="fa-solid fa-arrows-up-down-left-right mr-1 text-sky-400"></i>按住顶部标题栏可任意拖动位置</span>
                <span id="hazard-scale-indicator" class="text-amber-300/90 font-semibold">字号: 100%</span>
            </div>
        </div>
    </div>

    <!-- Mobile-only: left sidebar drawer toggle + backdrop -->
    <button id="mobile-drawer-toggle" onclick="toggleMobileDrawer()" title="打开/关闭左侧面板" aria-label="打开或关闭左侧面板">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div id="mobile-drawer-backdrop" onclick="toggleMobileDrawer(false)"></div>

    <!-- ================= TOP BAR: CLEAN HEADER + JAW SHOW/HIDE TOGGLES ================= -->
    <header class="fixed top-3 left-3 right-3 z-30 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
        <!-- Left: Main Mode Selector -->
        <div class="cad-panel px-2.5 py-1.5 rounded-2xl flex flex-wrap items-center gap-1 pointer-events-auto">
            <div class="flex items-center gap-2 pr-2 mr-1 border-r border-slate-700/80">
                <div class="w-7 h-7 rounded-xl bg-gradient-to-br from-sky-500 to-blue-700 flex items-center justify-center shadow">
                    <i class="fa-solid fa-tooth text-white text-xs"></i>
                </div>
                <div class="hidden md:block">
                    <div class="font-extrabold text-xs text-white leading-none">ProsthoMaster</div>
                    <div class="text-[9px] text-sky-400 font-semibold mt-0.5">口腔修复医患沟通</div>
                </div>
            </div>

            <button onclick="selectMainMode('single')" id="mode-btn-single" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800">
                单牙修复
            </button>
            <button onclick="selectMainMode('bridge')" id="mode-btn-bridge" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow">
                固定桥修复
            </button>
            <button onclick="selectMainMode('implant')" id="mode-btn-implant" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800">
                种植义齿
            </button>
            <button onclick="selectMainMode('rpd')" id="mode-btn-rpd" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800">
                可摘局部义齿
            </button>
            <button onclick="selectMainMode('complete')" id="mode-btn-complete" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold text-slate-300 hover:bg-slate-800">
                全口义齿
            </button>
            <div class="h-3.5 w-[1px] bg-slate-700 mx-0.5"></div>
            <button onclick="selectMainMode('custom')" id="mode-btn-custom" class="cad-btn px-3 py-1.5 rounded-xl text-xs font-bold bg-teal-500/20 text-teal-300 border border-teal-500/40 hover:bg-teal-500/30 flex items-center gap-1.5">
                <i class="fa-solid fa-teeth-open"></i> 自定义方案
            </button>
        </div>

        <!-- Right: Show/Hide Upper & Lower Jaw + Camera Quick Controls -->
        <div class="cad-panel p-1.5 rounded-2xl flex flex-wrap items-center gap-1 pointer-events-auto">
            <button onclick="toggleUpperJaw()" id="btn-toggle-upper" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-1" title="显示或隐藏上颌牙列">
                <i id="icon-toggle-upper" class="fa-regular fa-eye-slash text-slate-400"></i>
                <span id="text-toggle-upper">显示上颌</span>
            </button>
            <button onclick="toggleLowerJaw()" id="btn-toggle-lower" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow flex items-center gap-1" title="显示或隐藏下颌牙列">
                <i id="icon-toggle-lower" class="fa-solid fa-eye text-white"></i>
                <span id="text-toggle-lower">隐藏下颌</span>
            </button>
            <div class="h-3.5 w-[1px] bg-slate-700 mx-0.5"></div>
            <button onclick="toggleGumXray()" id="btn-xray" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs text-slate-200 hover:bg-slate-800 flex items-center gap-1 font-medium" title="透视牙龈观察内部牙槽骨与牙根">
                <i class="fa-solid fa-wand-magic text-rose-400"></i> <span id="text-gum-xray">透视牙龈</span>
            </button>
            <button onclick="toggleBoneXray()" id="btn-bone-xray" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs text-amber-200 bg-amber-950/60 border border-amber-500/40 hover:bg-amber-900/60 flex items-center gap-1 font-semibold" title="透视牙槽骨观察骨内牙根、种植体及骨吸收过程">
                <i class="fa-solid fa-bone text-amber-400"></i> <span id="text-bone-xray">牙槽骨:实体</span>
            </button>
            <button onclick="toggle3DClickEdit()" id="btn-3d-click-lock" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs bg-slate-800 text-slate-300 hover:bg-slate-700 flex items-center gap-1 font-medium border border-slate-700" title="防误触开关：关闭时旋转模型不会误触修改牙位">
                <i id="icon-3d-click-lock" class="fa-solid fa-lock text-amber-400"></i>
                <span id="text-3d-click-lock">3D点选:已锁</span>
            </button>
            <button onclick="toggleFdiLabels()" id="btn-fdi-labels" class="cad-btn px-2.5 py-1.5 rounded-xl text-xs bg-sky-600 text-white shadow flex items-center gap-1 font-bold border border-sky-400" title="显示或隐藏3D牙齿上方的FDI牙位悬浮微标签">
                <i class="fa-solid fa-tag"></i>
                <span id="text-fdi-labels">牙位标签:开</span>
            </button>
            <div class="h-3.5 w-[1px] bg-slate-700 mx-0.5"></div>
            <button onclick="setCamView('perspective')" class="cad-btn px-2 py-1.5 rounded-xl text-xs text-amber-300 hover:bg-slate-800 font-semibold">侧前斜视</button>
            <button onclick="setCamView('closeup')" class="cad-btn px-2 py-1.5 rounded-xl text-xs text-sky-300 hover:bg-slate-800 font-semibold">局部特写</button>
            <button onclick="setCamView('occlusal')" class="cad-btn px-2 py-1.5 rounded-xl text-xs text-teal-300 hover:bg-slate-800 font-semibold">合面俯视</button>
            <button onclick="document.getElementById('viewport-3d').classList.toggle('pure-black')" class="cad-btn px-2 py-1.5 rounded-xl text-xs text-slate-300 hover:bg-slate-800" title="切换深色背景">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>
        </div>
    </header>

    <!-- ================= LEFT SIDEBAR: COLLAPSIBLE SQUARE STATS, CUSTOM TOOLS, HAZARD EDU & ADVANCED PARAMS ================= -->
    <aside class="fixed top-16 left-3 z-20 flex flex-col gap-2 w-64 max-h-[calc(100vh-145px)] overflow-y-auto pr-1 pointer-events-none">

        <!-- 1. Square Collapsible Clinical Counter Card -->
        <div class="cad-panel rounded-2xl p-2.5 pointer-events-auto border border-sky-500/30">
            <button onclick="togglePanelSection('stats-card-body', 'stats-chevron')" class="w-full flex items-center justify-between text-xs font-extrabold text-white">
                <span class="flex items-center gap-1.5">
                    <i class="fa-solid fa-chart-pie text-sky-400"></i>
                    <span>修复颗数统计</span>
                </span>
                <div class="flex items-center gap-1.5">
                    <span id="stat-extra-badge" class="px-1.5 py-0.5 rounded bg-teal-500/20 text-teal-300 text-[10px] font-bold truncate max-w-[115px]">固定桥</span>
                    <i id="stats-chevron" class="fa-solid fa-chevron-up text-[10px] text-slate-400 transition-transform"></i>
                </div>
            </button>

            <!-- 2x2 Square Grid Body -->
            <div id="stats-card-body" class="grid grid-cols-2 gap-1.5 mt-2 pt-2 border-t border-slate-800/90">
                <div class="bg-slate-900/85 rounded-xl p-2 flex flex-col items-center justify-center border border-slate-800">
                    <span class="text-[10px] text-slate-400">缺牙/拔牙</span>
                    <span id="stat-missing-count" class="text-base font-black text-rose-400 leading-tight mt-0.5">1 颗</span>
                </div>
                <div class="bg-slate-900/85 rounded-xl p-2 flex flex-col items-center justify-center border border-slate-800">
                    <span class="text-[10px] text-slate-400">磨小基牙</span>
                    <span id="stat-grind-count" class="text-base font-black text-amber-400 leading-tight mt-0.5">2 颗</span>
                </div>
                <div class="bg-slate-900/85 rounded-xl p-2 flex flex-col items-center justify-center border border-slate-800">
                    <span class="text-[10px] text-slate-400">戴入修复体</span>
                    <span id="stat-wear-count" class="text-base font-black text-sky-400 leading-tight mt-0.5">3 颗</span>
                </div>
                <div class="bg-slate-900/85 rounded-xl p-2 flex flex-col items-center justify-center border border-slate-800">
                    <span class="text-[10px] text-slate-400">种植/卡环</span>
                    <span id="stat-implant-count" class="text-base font-black text-emerald-400 leading-tight mt-0.5">0 颗</span>
                </div>
            </div>
        </div>

        <!-- 2. Collapsible Custom Tools Card (Only shown in Custom Mode: Presets, Brushes, Save Plan) -->
        <div id="custom-left-card" class="cad-panel rounded-2xl p-2.5 pointer-events-auto border border-teal-500/35 hidden">
            <button onclick="togglePanelSection('custom-tools-body', 'custom-tools-chevron')" class="w-full flex items-center justify-between text-xs font-extrabold text-teal-300">
                <span class="flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>自定义操作与方案</span>
                </span>
                <i id="custom-tools-chevron" class="fa-solid fa-chevron-up text-[10px] text-slate-400 transition-transform"></i>
            </button>

            <div id="custom-tools-body" class="flex flex-col gap-2.5 mt-2 pt-2 border-t border-slate-800/90">
                <!-- Role Brushes -->
                <div>
                    <div class="text-[10px] text-slate-400 font-semibold mb-1">点击画笔后点选下方牙位或3D牙齿:</div>
                    <button onclick="setBrush('cycle')" id="brush-cycle" class="w-full cad-btn py-1.5 px-2 rounded-xl text-[11px] font-bold border border-teal-400 bg-teal-500/20 text-teal-200 ring-2 ring-sky-400 mb-1.5 flex items-center justify-center gap-1">
                        <i class="fa-solid fa-rotate"></i> 智能点选循环 (含活动牙/拔牙/缺牙)
                    </button>
                    <div class="grid grid-cols-2 gap-1 text-[11px]">
                        <button onclick="setBrush('abutment')" id="brush-abutment" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-amber-300 font-semibold">磨小做基牙</button>
                        <button onclick="setBrush('pontic')" id="brush-pontic" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-sky-300 font-semibold">缺牙(桥体冠)</button>
                        <button onclick="setBrush('implant')" id="brush-implant" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-emerald-300 font-semibold">缺牙(种牙)</button>
                        <button onclick="setBrush('rpd_pontic')" id="brush-rpd_pontic" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-pink-300 font-semibold">缺牙(活动牙)</button>
                        <button onclick="setBrush('rpd_clasp')" id="brush-rpd_clasp" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-purple-300 font-semibold">挂三臂卡环</button>
                        <button onclick="setBrush('extract')" id="brush-extract" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-orange-400 font-semibold">残根待拔除</button>
                        <button onclick="setBrush('missing_only')" id="brush-missing_only" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-rose-400 font-semibold">单纯缺牙(不镶)</button>
                        <button onclick="setBrush('normal')" id="brush-normal" class="cad-btn py-1 px-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 font-semibold">完好真牙</button>
                    </div>
                </div>

                <!-- 1-Click Presets -->
                <div class="pt-2 border-t border-slate-800/80">
                    <div class="text-[10px] text-slate-400 font-semibold mb-1">一键预设典型方案:</div>
                    <div class="grid grid-cols-2 gap-1 text-[11px]">
                        <button onclick="applyPreset('single1')" class="cad-btn py-1 px-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-amber-200 border border-slate-700">单冠(磨1戴1)</button>
                        <button onclick="applyPreset('post_core')" class="cad-btn py-1 px-1.5 rounded-lg bg-amber-950/80 hover:bg-amber-900 text-amber-300 border border-amber-500/40 font-semibold">残冠桩核冠(36)</button>
                        <button onclick="applyPreset('bridge3')" class="cad-btn py-1 px-1.5 rounded-lg bg-sky-950/80 hover:bg-sky-900 text-sky-300 border border-sky-500/40 font-semibold">后牙桥(缺1磨2)</button>
                        <button onclick="applyPreset('bridge4')" class="cad-btn py-1 px-1.5 rounded-lg bg-sky-950/80 hover:bg-sky-900 text-teal-300 border border-teal-500/40 font-semibold">长桥(缺2磨2)</button>
                        <button onclick="applyPreset('upper_ant4')" class="cad-btn py-1 px-1.5 rounded-lg bg-indigo-950/80 hover:bg-indigo-900 text-indigo-200 border border-indigo-500/40 font-semibold">上前牙桥(12-22)</button>

    <script>
        /*************************************************************************
         * 1. GLOBAL CLINICAL STATE & TIGHT-CONTACT MANDIBULAR/MAXILLARY ARCH SOLVER
         *************************************************************************/
        let currentMainMode = 'bridge';   // 'single' | 'bridge' | 'implant' | 'rpd' | 'complete' | 'custom' | 'unrestored_hazard' | 'cantilever_hazard'
        let singleSubType = 'crown';      // 'crown' | 'post_core' | 'veneer' | 'inlay'
        let bridgeConnectorType = 'rigid';// 'rigid' | 'nonrigid'
        let rpdClaspType = 'three_arm';
        let rpdIndirectEnabled = true;
        let materialMode = 'ceramic';     // 'ceramic' | 'pfm' | 'metal' | 'gold'
        let showCariesLesion = true;
        let selectedCustomFdi = 36;
        let isGumXray = false;
        let isBoneXray = false;
        let showTongue = true;
        let showFdi3DLabels = true;
        let fdiLabelAnchors = [];
        let hazardAnimNodes = [];
        let dynamicBoneMeshes = [];
        let hazardBannerScaleLevel = 0; // -1: compact, 0: standard(large), 1: XL, 2: XXL
        let hazardBannerDragInitialized = false;
        let timelineVal = 100;
        let activeBrush = 'cycle';
        let activeJawView = 'lower';
        let showUpperJaw = false;
        let showLowerJaw = true;
        let isAutoPlaying = false;
        let allow3DToothClick = false;
        let savedPlans = [];
        let editingPlanId = null;

        const LOWER_ARCH_FDI = [37, 36, 35, 34, 33, 32, 31, 41, 42, 43, 44, 45, 46, 47];
        const UPPER_ARCH_FDI = [27, 26, 25, 24, 23, 22, 21, 11, 12, 13, 14, 15, 16, 17];
        const ARCH_FDI = [...UPPER_ARCH_FDI, ...LOWER_ARCH_FDI];

        const TOOTH_SPEC = {
            1: { type: 'incisor',  md: 0.56, fl: 0.54, h: 0.94 },
            2: { type: 'incisor',  md: 0.61, fl: 0.58, h: 0.95 },
            3: { type: 'canine',   md: 0.69, fl: 0.72, h: 0.97 },
            4: { type: 'premolar', md: 0.74, fl: 0.80, h: 0.95 },
            5: { type: 'premolar', md: 0.77, fl: 0.84, h: 0.95 },
            6: { type: 'molar',    md: 1.14, fl: 1.06, h: 0.94 },
            7: { type: 'molar',    md: 1.07, fl: 1.02, h: 0.91 }
        };

        let archPoses = {};
        let archSpinePoints = [];
        let upperArchSpinePoints = [];

        function computeTightContactArchPoses() {
            const sampleN = 2000;
            const maxT = 1.0;
            const table = [];
            let accumS = 0;
            let prevX = 0, prevZ = 3.25;

            for (let i = 0; i <= sampleN; i++) {
                const t = (i / sampleN) * maxT;
                const x = 3.15 * Math.sin(t * Math.PI * 0.52) + 0.35 * t;
                const z = 3.25 - 6.65 * Math.pow(t, 1.48);
                if (i > 0) {
                    accumS += Math.hypot(x - prevX, z - prevZ);
                }
                table.push({ t, x, z, s: accumS });
                prevX = x; prevZ = z;
            }

            function sampleAtArcLength(targetS, sideSign) {
                let best = table[table.length - 1];
                for (let i = 0; i < table.length - 1; i++) {
                    if (table[i].s <= targetS && table[i + 1].s >= targetS) {
                        const r = (targetS - table[i].s) / Math.max(1e-6, table[i + 1].s - table[i].s);
                        const x = (table[i].x + r * (table[i + 1].x - table[i].x)) * sideSign;
                        const z = table[i].z + r * (table[i + 1].z - table[i].z);
                        const dx = (table[i + 1].x - table[i].x) * sideSign;
                        const dz = table[i + 1].z - table[i].z;
                        const len = Math.hypot(dx, dz) || 1;
                        const tx = dx / len, tz = dz / len;
                        const nx = sideSign > 0 ? -tz : tz;
                        const nz = sideSign > 0 ? tx : -tx;
                        const rotY = Math.atan2(nx, nz);
                        return { x, z, tx, tz, nx, nz, rotY };
                    }
                }
                return { x: best.x * sideSign, z: best.z, rotY: 0, nx: sideSign, nz: 0 };
            }

            const contactOverlap = 0.955;
            [
                { quad: 3, sign: 1 },
                { quad: 4, sign: -1 }
            ].forEach(({ quad, sign }) => {
                let cursorS = 0;
                for (let num = 1; num <= 7; num++) {
                    const fdi = quad * 10 + num;
                    const spec = TOOTH_SPEC[num];
                    const halfMd = (spec.md * contactOverlap) * 0.5;
                    cursorS += halfMd;
                    const pt = sampleAtArcLength(cursorS, sign);
                    cursorS += halfMd;

                    archPoses[fdi] = {
                        fdi, num, quad, isUpper: false, sign,
                        type: spec.type, md: spec.md, fl: spec.fl, h: spec.h,
                        x: pt.x, y: 0.28, z: pt.z,
                        rotY: pt.rotY, nx: pt.nx, nz: pt.nz,
                        arcS: cursorS - halfMd
                    };
                }
            });

            [
                { quad: 2, sign: 1 },
                { quad: 1, sign: -1 }
            ].forEach(({ quad, sign }) => {
                let cursorS = 0;
                for (let num = 1; num <= 7; num++) {
                    const fdi = quad * 10 + num;
                    const baseSpec = TOOTH_SPEC[num];
                    const mdScale = (num === 1) ? 1.18 : (num === 2 ? 1.04 : 1.01);
                    const md = baseSpec.md * mdScale;
                    const fl = baseSpec.fl * 1.02;
                    const h = baseSpec.h * 1.02;

                    const halfMd = (md * contactOverlap) * 0.5;
                    cursorS += halfMd;
                    const pt = sampleAtArcLength(cursorS * 0.96, sign);
                    cursorS += halfMd;

                    archPoses[fdi] = {
                        fdi, num, quad, isUpper: true, sign,
                        type: baseSpec.type, md, fl, h,
                        x: pt.x * 1.03, y: 2.35, z: pt.z + 0.10,
                        rotY: pt.rotY, nx: pt.nx, nz: pt.nz,
                        arcS: cursorS - halfMd
                    };
                }
            });

            archSpinePoints = [];
            upperArchSpinePoints = [];
            const maxArc = archPoses[37].arcS + 0.72;
            const steps = 64;
            for (let i = steps; i >= 1; i--) {
                const s = (i / steps) * maxArc;
                const p = sampleAtArcLength(s, -1);
                archSpinePoints.push({ x: p.x, z: p.z, s: -s, nx: p.nx, nz: p.nz });
                upperArchSpinePoints.push({ x: p.x * 1.03, z: p.z + 0.10, s: -s, nx: p.nx, nz: p.nz });
            }
            for (let i = 0; i <= steps; i++) {
                const s = (i / steps) * maxArc;
                const p = sampleAtArcLength(s, 1);
                archSpinePoints.push({ x: p.x, z: p.z, s: s, nx: p.nx, nz: p.nz });
                upperArchSpinePoints.push({ x: p.x * 1.03, z: p.z + 0.10, s: s, nx: p.nx, nz: p.nz });
            }
        }

        let customArch = {};
        let customSingleSubTypes = {};
        ARCH_FDI.forEach(fdi => {
            customArch[fdi] = 'normal';
            customSingleSubTypes[fdi] = 'crown';
        });

        function getToothPrepSubType(fdi) {
            if (currentMainMode === 'custom') {
                return customSingleSubTypes[fdi] || 'crown';
            }
            return singleSubType || 'crown';
        }

        /*************************************************************************
         * 2. THREE.JS ENGINE & CLINICAL DENTAL PBR MATERIALS
         *************************************************************************/
        let scene, camera, renderer, rootGroup;
        let morphableTeeth = [];
        let animatedProstheses = [];
        let gumMeshes = [];
        let boneMeshes = [];
        let tongueMesh = null;
        let clickableMeshes = [];
        let burMesh = null;

        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let camSphere = { radius: 9.6, theta: -0.46, phi: 1.06, target: new THREE.Vector3(0.2, -0.15, 0.2) };
        let isPointerDown = false, startXY = { x: 0, y: 0 };

        let matNaturalTooth, matBrightPorcelain, matTranslucentPorcelain,
            matGoldRestoration, matCoCrFramework, matTitaniumFixture,
            matHealthyGingiva, matAlveolarBone, matTongueMucosa, matPinkAcrylic, matKeywayBlue,
            matPfmCrown, matFiberPostCore, matGuttaPercha;

        function getActiveRestorationMaterial(forVeneerOrInlay = false) {
            if (materialMode === 'gold') return matGoldRestoration;
            if (materialMode === 'metal') return matCoCrFramework;
            if (materialMode === 'pfm') return matPfmCrown;
            return forVeneerOrInlay ? matTranslucentPorcelain : matBrightPorcelain;
        }

        /*************************************************************************
         * 3. HIGH-CONTRAST ANATOMICAL TOOTH SCULPTOR
         *************************************************************************/
        function evaluateAnatomicalToothVertex(u, theta, spec, prepType, isArtificialColor, hasDarkFissures, isPfmMode = false) {
            const { type, md, fl, h } = spec;
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);

            const capClose = (u < 0.04) ? Math.pow(u / 0.04, 0.42) : ((u > 0.94) ? Math.pow((1 - u) / 0.06, 0.45) : 1.0);
            const cervicalTight = u < 0.15 ? (0.68 + 0.18 * (u / 0.15)) : (0.86 + 0.17 * Math.sin(((u - 0.15) / 0.60) * Math.PI * 0.5));
            const occlusalRoll = u > 0.72 ? 1.0 - 0.16 * Math.pow((u - 0.72) / 0.28, 1.35) : 1.0;

            let widthProfile = cervicalTight * occlusalRoll * capClose;
            let depthProfile = (0.74 + 0.28 * Math.pow(Math.sin(u * Math.PI * 0.76), 0.85)) * occlusalRoll * capClose;

            const roundness = (type === 'molar') ? 0.26 : (type === 'premolar' ? 0.16 : 0.10);
            const sqX = Math.sign(cosT) * (Math.abs(cosT) * (1 - roundness) + Math.pow(Math.abs(cosT), 0.52) * roundness);
            const sqZ = Math.sign(sinT) * (Math.abs(sinT) * (1 - roundness) + Math.pow(Math.abs(sinT), 0.52) * roundness);

            let vx = (md * 0.52) * widthProfile * sqX;
            let vz = (fl * 0.52) * depthProfile * sqZ;
            let vy = (u - 0.46) * h;

            let fissureDepth = 0;

            if (type === 'molar') {
                if (u > 0.22 && u < 0.92) {
                    const buccalGroove = Math.exp(-Math.pow((cosT - 0.05) * 4.5, 2)) * 0.068 * fl * Math.sin(((u - 0.22) / 0.70) * Math.PI);
                    const distoBuccalGroove = Math.exp(-Math.pow((cosT + 0.48) * 5.5, 2)) * 0.042 * fl * Math.sin(((u - 0.28) / 0.64) * Math.PI);
                    if (sinT > 0) {
                        vz -= (buccalGroove + distoBuccalGroove);
                        vz += Math.exp(-Math.pow((u - 0.30) * 5.2, 2)) * 0.05 * fl * sinT;
                    } else {
                        vz += buccalGroove * 0.65;
                    }
                }
                if (u > 0.60) {
                    const topW = (u - 0.60) / 0.40;
                    const smoothW = topW * topW * (3 - 2 * topW);
                    const cuspAngles = Math.pow(Math.sin(2 * theta + 0.08 * cosT), 2);
                    const triangularRidge = Math.sin(Math.min(1, (1 - u) / 0.35) * Math.PI) * (0.75 + 0.25 * Math.cos(4 * theta));
                    const cuspLift = (cuspAngles * 0.24 + triangularRidge * 0.06) * h;
                    const marginalRidge = Math.pow(Math.abs(cosT), 3.0) * Math.sin(Math.min(1, (1 - u) / 0.28) * Math.PI) * 0.11 * h;
                    const zigZagZ = 0.06 * Math.sin(cosT * Math.PI * 2.5);
                    const mainMDGroove = Math.exp(-Math.pow((sinT - zigZagZ) * 6.5, 2)) * (1.0 - 0.45 * Math.pow(cosT, 4));
                    const BLGroove = Math.exp(-Math.pow((cosT - 0.04) * 6.0, 2)) + 0.65 * Math.exp(-Math.pow((cosT + 0.42) * 7.0, 2));
                    const centralFossaPit = Math.pow(Math.max(0, (u - 0.72) / 0.28), 1.18) * 0.29 * h;
                    const grooveCarve = (mainMDGroove * 0.065 + BLGroove * 0.048) * smoothW * h;

                    vy += smoothW * (cuspLift + marginalRidge) - centralFossaPit - grooveCarve;
                    fissureDepth = Math.min(1.0, ((centralFossaPit + grooveCarve * 1.6) / (0.26 * h)) * smoothW);
                }
            } else if (type === 'premolar') {
                if (sinT > 0 && u > 0.20 && u < 0.85) {
                    const labialRidge = Math.exp(-Math.pow(cosT * 2.5, 2)) * 0.048 * fl * Math.sin(((u - 0.20) / 0.65) * Math.PI);
                    vz += labialRidge;
                }
                if (u > 0.60) {
                    const topW = (u - 0.60) / 0.40;
                    const smoothW = topW * topW * (3 - 2 * topW);
                    const rimBell = Math.sin(Math.min(1, (1 - u) / 0.36) * Math.PI);
                    const twoCusp = Math.pow(sinT, 2) * (sinT > 0 ? 1.24 : 0.86);
                    const marginalRidge = Math.pow(Math.abs(cosT), 3.2) * rimBell * 0.09 * h;
                    const centralGroove = Math.exp(-Math.pow((sinT + 0.06) * 7.0, 2)) * (1 - 0.4 * Math.pow(cosT, 4)) * 0.055 * h;
                    const fossaDip = Math.pow(Math.max(0, (u - 0.73) / 0.27), 1.25) * 0.24 * h;

                    vy += smoothW * ((twoCusp * rimBell * 0.26 * h) + marginalRidge - fossaDip - centralGroove);
                    fissureDepth = Math.min(0.85, ((fossaDip + centralGroove * 1.5) / (0.21 * h)) * smoothW);
                }
            } else if (type === 'canine') {
                if (sinT > 0 && u > 0.18 && u < 0.92) {
                    const medianRidge = Math.exp(-Math.pow(cosT * 2.6, 2)) * 0.055 * fl;
                    const developmentalLobeGrooves = Math.exp(-Math.pow((Math.abs(cosT) - 0.48) * 6.5, 2)) * 0.024 * fl;
                    vz += (medianRidge - developmentalLobeGrooves) * Math.sin(((u - 0.18) / 0.74) * Math.PI);
                }
                if (sinT < 0) {
                    if (u < 0.48) {
                        vz -= Math.sin((u / 0.48) * Math.PI) * 0.068 * fl * Math.pow(Math.abs(sinT), 1.4);
                    } else {
                        const lingualFossa = Math.exp(-Math.pow(cosT * 2.2, 2)) * 0.06 * fl;
                        const lingualMarginalRidge = Math.exp(-Math.pow((Math.abs(cosT) - 0.72) * 5.0, 2)) * 0.035 * fl;
                        vz *= (1.0 - (u - 0.48) * 0.48);
                        vz += (lingualFossa - lingualMarginalRidge) * Math.sin(((u - 0.48) / 0.52) * Math.PI);
                    }
                }
                if (u > 0.64) {
                    const topW = (u - 0.64) / 0.36;
                    const caninePeak = Math.exp(-Math.pow(cosT * 1.45, 2)) * 0.11 * h;
                    const mesialDistalSlopes = Math.pow(Math.abs(cosT), 1.6) * 0.06 * h;
                    vy += topW * (caninePeak - mesialDistalSlopes);
                }
            } else {
                const incisalFlare = 0.72 + 0.36 * Math.pow(u, 0.72);
                vx = (md * 0.52) * incisalFlare * capClose * sqX;

                if (sinT > 0.15 && u > 0.24 && u < 0.94) {
                    const twoGrooves = (Math.exp(-Math.pow((cosT - 0.36) * 7.5, 2)) + Math.exp(-Math.pow((cosT + 0.36) * 7.5, 2))) * 0.026 * fl;
                    vz -= twoGrooves * Math.sin(((u - 0.24) / 0.70) * Math.PI);
                }
                if (sinT < 0) {
                    if (u < 0.44) {
                        vz -= Math.sin((u / 0.44) * Math.PI) * 0.065 * fl * Math.abs(sinT);
                    } else {
                        const fossaConcavity = Math.exp(-Math.pow(cosT * 2.1, 2)) * 0.08 * fl;
                        const marginalRidges = Math.exp(-Math.pow((Math.abs(cosT) - 0.76) * 5.5, 2)) * 0.042 * fl;
                        vz += (fossaConcavity - marginalRidges) * Math.sin(((u - 0.44) / 0.56) * Math.PI);
                    }
                }
                if (u > 0.30) {
                    const thinFactor = 1.0 - Math.pow((u - 0.30) / 0.70, 1.08) * 0.65;
                    vz *= thinFactor;
                }
                if (u > 0.85) {
                    const mamelons = Math.cos(cosT * Math.PI * 3.0) * 0.012 * h;
                    vy -= (u - 0.85) * 0.22 * h - mamelons;
                }
            }

            let isExposedDentin = false;
            if (prepType === 'crown') {
                if (u > 0.18) {
                    const shoulderStep = Math.min(1, (u - 0.18) / 0.05);
                    const axialTaper = (u - 0.18) / 0.82;
                    const shrink = 1.0 - shoulderStep * (0.30 + axialTaper * 0.16);
                    vx *= shrink;
                    vz *= shrink;
                    if (u > 0.56) {
                        vy -= (u - 0.56) * 0.36 * h;
                    }
                    isExposedDentin = (shoulderStep > 0.25);
                    fissureDepth *= 0.2;
                }
            } else if (prepType === 'post_core') {
                // Endodontically treated residual crown ferrule preparation (桩核冠残冠预备：保留 1.5mm 本质肩领 Ferrule + 中央根管桩道口凹陷)
                if (u > 0.16) {
                    const shoulderStep = Math.min(1, (u - 0.16) / 0.05);
                    const shrink = 1.0 - shoulderStep * 0.32;
                    vx *= shrink;
                    vz *= shrink;
                    if (u > 0.30) {
                        const ferruleCut = (u - 0.30) / 0.70;
                        vy -= ferruleCut * 0.68 * h;
                        if (u > 0.68) {
                            const canalDepth = (u - 0.68) / 0.32;
                            vy -= canalDepth * 0.38 * h;
                        }
                    }
                    isExposedDentin = (shoulderStep > 0.20);
                    fissureDepth = 0;
                }
            } else if (prepType === 'veneer') {
                if (vz > 0.02 && u > 0.16) {
                    const step = Math.min(1, (u - 0.16) / 0.06) * Math.min(1, (vz - 0.02) / 0.10);
                    vz -= step * 0.14 * fl;
                    if (u > 0.82) vy -= step * 0.08 * h;
                    isExposedDentin = (step > 0.35);
                }
            } else if (prepType === 'inlay') {
                const normX = vx / (md * 0.5);
                const normZ = vz / (fl * 0.5);
                const inMainGroove = Math.exp(-Math.pow(normZ * 3.1, 2)) * Math.max(0, 1.0 - Math.pow((normX - 0.12) / 0.72, 4));
                const proximalFlare = normX > 0.10
                    ? Math.exp(-Math.pow(normZ * 2.2, 2)) * Math.pow(Math.min(1, (normX - 0.10) / 0.65), 1.4)
                    : 0;

                const cavityWeight = Math.min(1.0, inMainGroove * 0.85 + proximalFlare * 0.95);
                if (cavityWeight > 0.12 && u > 0.38) {
                    const verticalReach = proxWeightFloor(u, proximalFlare > 0.25 ? 0.38 : 0.56);
                    const carveAmount = cavityWeight * verticalReach;
                    if (carveAmount > 0.05) {
                        const targetFloorY = (proximalFlare > 0.32 && normX > 0.42) ? (-0.02 * h) : (0.12 * h);
                        vy = vy * (1 - carveAmount) + targetFloorY * carveAmount;
                        if (proximalFlare > 0.35 && u > 0.42) {
                            vx *= (1.0 - carveAmount * 0.08);
                        }
                        if (carveAmount > 0.22) {
                            isExposedDentin = true;
                        }
                    }
                }
            }

            const interproximalAO = 1.0 - 0.15 * Math.pow(Math.abs(cosT), 3.2) * (1.0 - 0.4 * u);
            const cervicalAO = u < 0.18 ? (0.86 + 0.14 * (u / 0.18)) : 1.0;
            const aoFactor = interproximalAO * cervicalAO;

            let r, g, b;
            if (isExposedDentin) {
                r = 0.82 * aoFactor; g = 0.65 * aoFactor; b = 0.36 * aoFactor;
            } else if (isArtificialColor) {
                if (isPfmMode && (u < 0.11 || (sinT < -0.25 && u < 0.24))) {
                    r = 0.48 * aoFactor;
                    g = 0.52 * aoFactor;
                    b = 0.57 * aoFactor;
                } else {
                    const incisalTrans = Math.max(0, (u - 0.72) / 0.28);
                    r = (0.94 - incisalTrans * 0.03) * aoFactor;
                    g = (0.93 - incisalTrans * 0.02) * aoFactor;
                    b = (0.88 - incisalTrans * 0.01) * aoFactor;
                    if ((type === 'molar' || type === 'premolar') && fissureDepth > 0.15) {
                        const grooveShade = Math.min(0.35, (fissureDepth - 0.15) * 0.65);
                        r *= (1 - grooveShade * 0.35);
                        g *= (1 - grooveShade * 0.40);
                        b *= (1 - grooveShade * 0.48);
                    }
                }
            } else {
                if (u < 0.28) {
                    const t = u / 0.28;
                    r = 0.86; g = 0.70 + t * 0.08; b = 0.45 + t * 0.13;
                } else if (u < 0.78) {
                    const t = (u - 0.28) / 0.50;
                    r = 0.89; g = 0.78 + t * 0.06; b = 0.58 + t * 0.12;
                } else {
                    const t = (u - 0.78) / 0.22;
                    r = 0.89 - t * 0.03; g = 0.84; b = 0.70 + t * 0.05;
                }
                r *= aoFactor; g *= aoFactor; b *= aoFactor;

                if (hasDarkFissures && (type === 'molar' || type === 'premolar') && fissureDepth > 0.16) {
                    const stain = Math.min(0.75, (fissureDepth - 0.16) * 1.45);
                    r = r * (1 - stain) + 0.24 * stain;
                    g = g * (1 - stain) + 0.18 * stain;
                    b = b * (1 - stain) + 0.14 * stain;
                }
            }

            return { x: vx, y: vy, z: vz, r, g, b };
        }

        function proxWeightFloor(u, minU) {
            if (u <= minU) return 0;
            const t = Math.min(1, (u - minU) / (1.0 - minU));
            return t * t * (3 - 2 * t);
        }

        function applyCariesToIntactVertex(p, u, theta, spec, prepType) {
            const { md, fl, h } = spec;
            const cosT = Math.cos(theta);
            const sinT = Math.sin(theta);
            let { x, y, z, r, g, b } = p;

            if (prepType === 'veneer') {
                if (sinT > 0.25 && u > 0.26 && u < 0.76) {
                    const d = Math.hypot((cosT - 0.18) * 2.2, (u - 0.50) * 3.0);
                    if (d < 1.0) {
                        const cW = Math.pow(1.0 - d, 1.4);
                        z -= cW * 0.11 * fl;
                        const dark = Math.min(0.92, cW * 1.35);
                        r = r * (1 - dark) + 0.16 * dark;
                        g = g * (1 - dark) + 0.09 * dark;
                        b = b * (1 - dark) + 0.05 * dark;
                    }
                }
            } else {
                if (u > 0.52) {
                    const dx = (x - 0.14 * md) / (0.38 * md);
                    const dz = z / (0.34 * fl);
                    const distSq = dx * dx + dz * dz;
                    if (distSq < 1.0) {
                        const cW = Math.pow(1.0 - distSq, 1.35) * Math.min(1, (u - 0.52) / 0.18);
                        const irregularity = 0.85 + 0.15 * Math.sin(theta * 5.0);
                        y -= cW * irregularity * 0.24 * h;
                        const dark = Math.min(0.95, cW * 1.45);
                        r = r * (1 - dark) + 0.13 * dark;
                        g = g * (1 - dark) + 0.08 * dark;
                        b = b * (1 - dark) + 0.04 * dark;
                    }
                }
            }
            return { x, y, z, r, g, b };
        }

        function createArchToothMesh(spec, morphPrepType = 'none', isArtificial = false, customMat = null, hasDarkFissures = true, hasCaries = false, isPonticSolid = false) {
            const radialSegs = 64;
            const heightSegs = 40;
            // Only open the bottom cylinder cap for hollow retainer crowns in PFM mode; pontics (桥体) are ALWAYS solid closed!
            const isOpenBottomCrown = isArtificial && (customMat === matPfmCrown) && !isPonticSolid;
            const geo = new THREE.CylinderGeometry(0.5, 0.5, 1.0, radialSegs, heightSegs, isOpenBottomCrown);
            const posAttr = geo.attributes.position;
            const vCount = posAttr.count;

            const intactPos = new Float32Array(vCount * 3);
            const intactCol = new Float32Array(vCount * 3);
            const preppedPos = new Float32Array(vCount * 3);
            const preppedCol = new Float32Array(vCount * 3);

            const v = new THREE.Vector3();
            for (let i = 0; i < vCount; i++) {
                v.fromBufferAttribute(posAttr, i);
                // Keep u=0 and u=1 strictly closed for solid pontics & natural teeth so bottom/top caps are 100% solid watertight
                const u = isOpenBottomCrown
                    ? Math.max(0.05, Math.min(1.0, v.y + 0.5))
                    : Math.max(0.0, Math.min(1.0, v.y + 0.5));
                const theta = Math.atan2(v.z, v.x);

                let pIntact = evaluateAnatomicalToothVertex(u, theta, spec, 'none', isArtificial, hasDarkFissures, isOpenBottomCrown);
                if (isPonticSolid && u < 0.14) {
                    // Smooth convex ridge-lap / ovate pontic gingival base (实心圆润桥体龈端，紧密贴合牙槽嵴且绝无底部孔洞)
                    const ridgeConvex = Math.cos((u / 0.14) * Math.PI * 0.5);
                    pIntact.y -= ridgeConvex * 0.045 * spec.h;
                }
                if (hasCaries && !isArtificial) {
                    pIntact = applyCariesToIntactVertex(pIntact, u, theta, spec, morphPrepType);
                }
                if (morphPrepType === 'post_core' && hasCaries && !isArtificial) {
                    if (u > 0.45 && (theta > -0.8 && theta < 2.1)) {
                        const defectW = Math.min(1, (u - 0.45) / 0.35);
                        pIntact.y -= defectW * 0.46 * spec.h;
                        pIntact.r = 0.22; pIntact.g = 0.14; pIntact.b = 0.08;
                    }
                }

                intactPos[i * 3]     = pIntact.x;
                intactPos[i * 3 + 1] = pIntact.y;
                intactPos[i * 3 + 2] = pIntact.z;
                intactCol[i * 3]     = pIntact.r;
                intactCol[i * 3 + 1] = pIntact.g;
                intactCol[i * 3 + 2] = pIntact.b;

                const pPrep = (morphPrepType === 'none')
                    ? pIntact
                    : evaluateAnatomicalToothVertex(u, theta, spec, morphPrepType, isArtificial, hasDarkFissures, isOpenBottomCrown);
                preppedPos[i * 3]     = pPrep.x;
                preppedPos[i * 3 + 1] = pPrep.y;
                preppedPos[i * 3 + 2] = pPrep.z;
                preppedCol[i * 3]     = pPrep.r;
                preppedCol[i * 3 + 1] = pPrep.g;
                preppedCol[i * 3 + 2] = pPrep.b;

                posAttr.setXYZ(i, pPrep.x, pPrep.y, pPrep.z);
            }

            geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(preppedCol), 3));
            geo.computeVertexNormals();

            const mat = customMat || (isArtificial ? getActiveRestorationMaterial(false) : matNaturalTooth);
            const mesh = new THREE.Mesh(geo, mat);

            if (morphPrepType !== 'none') {
                morphableTeeth.push({
                    mesh,
                    intactPos,
                    intactCol,
                    preppedPos,
                    preppedCol
                });
            }
            return mesh;
        }

        function createToothRootMesh(spec, showRctGuttaPercha = false) {
            const grp = new THREE.Group();
            const rootMat = new THREE.MeshStandardMaterial({
                color: 0xd4a359,
                roughness: 0.45,
                transparent: showRctGuttaPercha,
                opacity: showRctGuttaPercha ? 0.58 : 1.0
            });
            if (spec.type === 'molar') {
                [-0.24 * spec.md, 0.24 * spec.md].forEach(rx => {
                    const rGeo = new THREE.CylinderGeometry(0.26 * spec.fl, 0.07 * spec.fl, 1.35, 14, 6);
                    const m = new THREE.Mesh(rGeo, rootMat);
                    m.position.set(rx, -0.95, 0);
                    grp.add(m);
                    if (showRctGuttaPercha) {
                        const gpGeo = new THREE.CylinderGeometry(0.065 * spec.fl, 0.025 * spec.fl, 1.26, 10);
                        const gp = new THREE.Mesh(gpGeo, matGuttaPercha);
                        gp.position.set(rx, -0.96, 0);
                        grp.add(gp);
                    }
                });
            } else {
                const rGeo = new THREE.CylinderGeometry(0.28 * spec.md, 0.08 * spec.md, 1.40, 16, 6);
                const m = new THREE.Mesh(rGeo, rootMat);
                m.position.set(0, -0.98, 0);
                grp.add(m);
                if (showRctGuttaPercha) {
                    const gpGeo = new THREE.CylinderGeometry(0.075 * spec.md, 0.028 * spec.md, 1.30, 12);
                    const gp = new THREE.Mesh(gpGeo, matGuttaPercha);
                    gp.position.set(0, -0.99, 0);
                    grp.add(gp);
                }
            }
            return grp;
        }

        function buildPostAndCoreNode(spec) {
            const grp = new THREE.Group();
            const postMat = (materialMode === 'metal') ? matCoCrFramework : (materialMode === 'gold' ? matGoldRestoration : matFiberPostCore);

            if (spec.type === 'molar') {
                const postDistal = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.09 * spec.fl, 0.045 * spec.fl, 0.92, 16),
                    postMat
                );
                postDistal.position.set(0.22 * spec.md, -0.58, 0);
                const postMesial = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.075 * spec.fl, 0.04 * spec.fl, 0.65, 16),
                    postMat
                );
                postMesial.position.set(-0.20 * spec.md, -0.45, 0);
                grp.add(postDistal, postMesial);
            } else {
                const singlePost = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.10 * spec.md, 0.045 * spec.md, 0.96, 18),
                    postMat
                );
                singlePost.position.set(0, -0.60, 0);
                grp.add(singlePost);
            }

            const coreGeo = new THREE.CylinderGeometry(0.28 * spec.md, 0.34 * spec.md, 0.46 * spec.h, 32, 12);
            const cPos = coreGeo.attributes.position;
            const roundness = (spec.type === 'molar') ? 0.26 : 0.14;
            for (let i = 0; i < cPos.count; i++) {
                const vx = cPos.getX(i);
                const vy = cPos.getY(i);
                const vz = cPos.getZ(i);
                const theta = Math.atan2(vz, vx);
                const rNorm = Math.hypot(vx / (0.34 * spec.md), vz / (0.34 * spec.md));
                const cosT = Math.cos(theta), sinT = Math.sin(theta);
                const sqX = Math.sign(cosT) * (Math.abs(cosT) * (1 - roundness) + Math.pow(Math.abs(cosT), 0.55) * roundness);
                const sqZ = Math.sign(sinT) * (Math.abs(sinT) * (1 - roundness) + Math.pow(Math.abs(sinT), 0.55) * roundness);
                cPos.setXYZ(i, sqX * rNorm * 0.31 * spec.md, vy, sqZ * rNorm * 0.31 * spec.fl);
            }
            coreGeo.computeVertexNormals();
            const coreMesh = new THREE.Mesh(coreGeo, postMat);
            coreMesh.position.y = -0.02 * spec.h;
            grp.add(coreMesh);

            return grp;
        }

        /*************************************************************************
         * 4. U-SHAPED GINGIVA, TONGUE & THIN ANATOMICAL DENTURE BASE
         *************************************************************************/
        function buildSingleArchGingivaMesh(spinePoints, jawPoses, missingFdiList, isUpper) {
            const uSteps = 128;
            const vSteps = 36;
            const gumGeo = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];
            const indices = [];

            for (let i = 0; i <= uSteps; i++) {
                const uFrac = i / uSteps;
                const spineIdx = uFrac * (spinePoints.length - 1);
                const i0 = Math.floor(spineIdx);
                const i1 = Math.min(spinePoints.length - 1, i0 + 1);
                const r = spineIdx - i0;

                const sx = spinePoints[i0].x + r * (spinePoints[i1].x - spinePoints[i0].x);
                const sz = spinePoints[i0].z + r * (spinePoints[i1].z - spinePoints[i0].z);
                const nx = spinePoints[i0].nx + r * (spinePoints[i1].nx - spinePoints[i0].nx);
                const nz = spinePoints[i0].nz + r * (spinePoints[i1].nz - spinePoints[i0].nz);
                const nLen = Math.hypot(nx, nz) || 1;
                const unx = nx / nLen, unz = nz / nLen;

                let marginWave = 0;
                let rootEminence = 0;
                let edentulousDip = 0;

                jawPoses.forEach(tp => {
                    const dist = Math.hypot(sx - tp.x, sz - tp.z);
                    const radius = tp.md * 0.56;
                    if (dist < radius * 1.35) {
                        const normD = dist / radius;
                        if (missingFdiList.includes(tp.fdi)) {
                            if (normD < 1.15) {
                                edentulousDip += Math.cos(normD * Math.PI * 0.42) * 0.24;
                            }
                        } else {
                            if (normD < 1.0) {
                                marginWave -= Math.cos(normD * Math.PI * 0.5) * 0.14;
                                rootEminence += Math.cos(normD * Math.PI * 0.5) * 0.11;
                            } else if (normD < 1.32) {
                                marginWave += Math.sin(((normD - 1.0) / 0.32) * Math.PI) * 0.13;
                            }
                        }
                    }
                });

                const endCap = (uFrac < 0.03) ? (uFrac / 0.03) : ((uFrac > 0.97) ? ((1 - uFrac) / 0.03) : 1.0);
                const smoothCap = Math.pow(endCap, 0.45);

                for (let j = 0; j <= vSteps; j++) {
                    const vFrac = j / vSteps;
                    const angle = vFrac * Math.PI * 2;
                    const sinA = Math.sin(angle);
                    const cosA = Math.cos(angle);

                    let halfThick = 0.68 * (0.85 + 0.22 * Math.max(0, -sinA));
                    if (cosA > 0.2 && sinA > -0.4 && sinA < 0.75) {
                        halfThick += rootEminence * cosA * Math.sin(((sinA + 0.4) / 1.15) * Math.PI);
                    }
                    halfThick *= smoothCap;

                    let localY = -0.78 + 0.82 * sinA;
                    if (sinA > 0.25) {
                        const topWeight = (sinA - 0.25) / 0.75;
                        localY += topWeight * (marginWave * (0.6 + 0.4 * Math.abs(cosA)) - edentulousDip);
                    }

                    const py = isUpper ? (2.63 - localY) : localY;
                    const px = sx + unx * (cosA * halfThick);
                    const pz = sz + unz * (cosA * halfThick);
                    vertices.push(px, py, pz);

                    const crestFactor = Math.max(0, (sinA + 0.2) / 1.2);
                    const gr = 0.76 + crestFactor * 0.12;
                    const gg = 0.19 + crestFactor * 0.16;
                    const gb = 0.26 + crestFactor * 0.17;
                    colors.push(gr, gg, gb);
                }
            }

            for (let i = 0; i < uSteps; i++) {
                for (let j = 0; j < vSteps; j++) {
                    const a = i * (vSteps + 1) + j;
                    const b = (i + 1) * (vSteps + 1) + j;
                    const c = (i + 1) * (vSteps + 1) + (j + 1);
                    const d = i * (vSteps + 1) + (j + 1);
                    if (isUpper) {
                        indices.push(a, d, b);
                        indices.push(b, d, c);
                    } else {
                        indices.push(a, b, d);
                        indices.push(b, c, d);
                    }
                }
            }

            gumGeo.setIndex(indices);
            gumGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            gumGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            gumGeo.computeVertexNormals();

            const gumMesh = new THREE.Mesh(gumGeo, matHealthyGingiva);
            gumMesh.renderOrder = 2;
            gumMeshes.push(gumMesh);
            return gumMesh;
        }

        /**
         * Builds the anatomical 3D Alveolar Bone (牙槽骨) beneath the gingiva, with cortical bone crest,
         * interdental septa, root eminentiae, and realistic dynamic bone resorption morphing.
         * Supports both array of FDI numbers or array of { fdi, vert, horiz, heat, distalBias } specs.
         */
        function buildSingleArchAlveolarBoneMesh(spinePoints, jawPoses, missingFdiList, isUpper, dynamicResorbSpecs = []) {
            const uSteps = 128;
            const vSteps = 32;
            const boneGeo = new THREE.BufferGeometry();
            const vertices = [];
            const intactPos = [];
            const resorbedPos = [];
            const intactCol = [];
            const resorbedCol = [];
            const indices = [];

            const resorbMap = {};
            dynamicResorbSpecs.forEach(item => {
                if (typeof item === 'number') {
                    resorbMap[item] = { vert: 0.24, horiz: 0.12, heat: 0.72, radiusMul: 1.32 };
                } else if (item && item.fdi) {
                    resorbMap[item.fdi] = {
                        vert: item.vert ?? 0.20,
                        horiz: item.horiz ?? 0.10,
                        heat: item.heat ?? 0.70,
                        radiusMul: item.radiusMul ?? 1.28
                    };
                }
            });

            for (let i = 0; i <= uSteps; i++) {
                const uFrac = i / uSteps;
                const spineIdx = uFrac * (spinePoints.length - 1);
                const i0 = Math.floor(spineIdx);
                const i1 = Math.min(spinePoints.length - 1, i0 + 1);
                const r = spineIdx - i0;

                const sx = spinePoints[i0].x + r * (spinePoints[i1].x - spinePoints[i0].x);
                const sz = spinePoints[i0].z + r * (spinePoints[i1].z - spinePoints[i0].z);
                const nx = spinePoints[i0].nx + r * (spinePoints[i1].nx - spinePoints[i0].nx);
                const nz = spinePoints[i0].nz + r * (spinePoints[i1].nz - spinePoints[i0].nz);
                const nLen = Math.hypot(nx, nz) || 1;
                const unx = nx / nLen, unz = nz / nLen;

                let boneCrestWave = 0;
                let staticResorbDip = 0;
                let dynResorbVert = 0;
                let dynResorbHoriz = 0;
                let resorbHeat = 0;

                jawPoses.forEach(tp => {
                    const dist = Math.hypot(sx - tp.x, sz - tp.z);
                    const radius = tp.md * 0.58;
                    const rSpec = resorbMap[tp.fdi];

                    if (dist < radius * 1.45) {
                        const normD = dist / radius;
                        if (missingFdiList.includes(tp.fdi)) {
                            // Subtle physiological post-extraction socket remodeling (even across 36 & 37)
                            if (normD < 1.20) {
                                staticResorbDip = Math.max(staticResorbDip, Math.cos(normD * Math.PI * 0.42) * 0.14);
                            }
                        } else {
                            if (normD < 1.0) {
                                boneCrestWave -= Math.cos(normD * Math.PI * 0.5) * 0.11;
                            } else if (normD < 1.32) {
                                boneCrestWave += Math.sin(((normD - 1.0) / 0.32) * Math.PI) * 0.09;
                            }
                        }

                        if (rSpec && normD < rSpec.radiusMul) {
                            const w = Math.pow(Math.cos(Math.min(1, normD / rSpec.radiusMul) * Math.PI * 0.5), 1.35);
                            // Use smooth max blending so adjacent 36 & 37 saddle resorption stays uniform without double-dipping at 36!
                            dynResorbVert = Math.max(dynResorbVert, w * rSpec.vert);
                            dynResorbHoriz = Math.max(dynResorbHoriz, w * rSpec.horiz);
                            resorbHeat = Math.max(resorbHeat, w * rSpec.heat);
                        }
                    }
                });

                const endCap = (uFrac < 0.03) ? (uFrac / 0.03) : ((uFrac > 0.97) ? ((1 - uFrac) / 0.03) : 1.0);
                const smoothCap = Math.pow(endCap, 0.45);

                for (let j = 0; j <= vSteps; j++) {
                    const vFrac = j / vSteps;
                    const angle = vFrac * Math.PI * 2;
                    const sinA = Math.sin(angle);
                    const cosA = Math.cos(angle);

                    const baseHalfThick = 0.56 * (0.84 + 0.22 * Math.max(0, -sinA)) * smoothCap;
                    const crestWeight = sinA > -0.10 ? Math.pow((sinA + 0.10) / 1.10, 1.35) : 0;

                    let localY0 = -0.84 + 0.69 * sinA;
                    if (sinA > 0.20) {
                        const topW = (sinA - 0.20) / 0.80;
                        localY0 += topW * (boneCrestWave - staticResorbDip);
                    }

                    // Realistic, moderate crest resorption (never exaggerated)
                    const localY1 = localY0 - crestWeight * dynResorbVert;
                    const halfThick1 = Math.max(0.24, baseHalfThick - crestWeight * dynResorbHoriz);

                    const py0 = isUpper ? (2.63 - localY0) : localY0;
                    const px0 = sx + unx * (cosA * baseHalfThick);
                    const pz0 = sz + unz * (cosA * baseHalfThick);

                    const py1 = isUpper ? (2.63 - localY1) : localY1;
                    const px1 = sx + unx * (cosA * halfThick1);
                    const pz1 = sz + unz * (cosA * halfThick1);

                    intactPos.push(px0, py0, pz0);
                    resorbedPos.push(px1, py1, pz1);
                    vertices.push(px0, py0, pz0);

                    const boneShade = 0.82 + 0.12 * Math.max(0, sinA);
                    const r0 = 0.88 * boneShade;
                    const g0 = 0.81 * boneShade;
                    const b0 = 0.66 * boneShade;
                    intactCol.push(r0, g0, b0);

                    const heatW = Math.min(0.78, resorbHeat * crestWeight * 1.15);
                    const r1 = r0 * (1 - heatW) + 0.88 * heatW;
                    const g1 = g0 * (1 - heatW) + 0.28 * heatW;
                    const b1 = b0 * (1 - heatW) + 0.22 * heatW;
                    resorbedCol.push(r1, g1, b1);
                }
            }

            for (let i = 0; i < uSteps; i++) {
                for (let j = 0; j < vSteps; j++) {
                    const a = i * (vSteps + 1) + j;
                    const b = (i + 1) * (vSteps + 1) + j;
                    const c = (i + 1) * (vSteps + 1) + (j + 1);
                    const d = i * (vSteps + 1) + (j + 1);
                    if (isUpper) {
                        indices.push(a, d, b);
                        indices.push(b, d, c);
                    } else {
                        indices.push(a, b, d);
                        indices.push(b, c, d);
                    }
                }
            }

            boneGeo.setIndex(indices);
            boneGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            boneGeo.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(intactCol), 3));
            boneGeo.computeVertexNormals();

            const boneMesh = new THREE.Mesh(boneGeo, matAlveolarBone);
            boneMesh.renderOrder = 1;
            boneMeshes.push(boneMesh);

            if (dynamicResorbSpecs.length > 0) {
                dynamicBoneMeshes.push({
                    mesh: boneMesh,
                    intactPos: new Float32Array(intactPos),
                    resorbedPos: new Float32Array(resorbedPos),
                    intactCol: new Float32Array(intactCol),
                    resorbedCol: new Float32Array(resorbedCol)
                });
            }
            return boneMesh;
        }

        function buildFullMandibularGingivaAndTongue(missingFdiList = [], dynamicResorbFdis = []) {
            const grp = new THREE.Group();

            if (activeJawView === 'lower' || activeJawView === 'both') {
                const lowerPoses = LOWER_ARCH_FDI.map(fdi => archPoses[fdi]);
                grp.add(buildSingleArchAlveolarBoneMesh(archSpinePoints, lowerPoses, missingFdiList, false, dynamicResorbFdis));
                grp.add(buildSingleArchGingivaMesh(archSpinePoints, lowerPoses, missingFdiList, false));
            }

            if (activeJawView === 'upper' || activeJawView === 'both') {
                const upperPoses = UPPER_ARCH_FDI.map(fdi => archPoses[fdi]);
                grp.add(buildSingleArchAlveolarBoneMesh(upperArchSpinePoints, upperPoses, missingFdiList, true, dynamicResorbFdis));
                grp.add(buildSingleArchGingivaMesh(upperArchSpinePoints, upperPoses, missingFdiList, true));
            }

            const tongueGeo = new THREE.SphereGeometry(2.35, 48, 36);
            const tPos = tongueGeo.attributes.position;
            const tv = new THREE.Vector3();
            for (let i = 0; i < tPos.count; i++) {
                tv.fromBufferAttribute(tPos, i);
                tv.x *= 0.92 * (0.88 - 0.14 * (tv.z / 2.35));
                tv.y *= 0.46;
                tv.z *= 1.32;
                if (tv.y > 0) {
                    const groove = Math.exp(-Math.pow(tv.x * 2.4, 2)) * 0.22 * (tv.y / 1.08);
                    tv.y -= groove;
                    if (tv.z > 0.5) {
                        tv.y -= Math.pow((tv.z - 0.5) / 2.6, 1.6) * 0.32;
                    }
                }
                tPos.setXYZ(i, tv.x, tv.y, tv.z);
            }
            tongueGeo.computeVertexNormals();
            tongueMesh = new THREE.Mesh(tongueGeo, matTongueMucosa);
            tongueMesh.position.set(0, -0.42, -0.55);
            tongueMesh.visible = showTongue && (activeJawView !== 'upper');
            grp.add(tongueMesh);

            return grp;
        }

        function buildThinAnatomicalDentureBase(spinePoints, jawPoses, targetFdiSet, isUpper) {
            const uSteps = 128;
            const vSteps = 28;
            const shellThick = 0.042;

            const activeIndices = [];
            for (let i = 0; i <= uSteps; i++) {
                const uFrac = i / uSteps;
                const spineIdx = uFrac * (spinePoints.length - 1);
                const i0 = Math.floor(spineIdx);
                const i1 = Math.min(spinePoints.length - 1, i0 + 1);
                const r = spineIdx - i0;
                const sx = spinePoints[i0].x + r * (spinePoints[i1].x - spinePoints[i0].x);
                const sz = spinePoints[i0].z + r * (spinePoints[i1].z - spinePoints[i0].z);

                let covered = false;
                for (let k = 0; k < jawPoses.length; k++) {
                    const tp = jawPoses[k];
                    if (targetFdiSet.has(tp.fdi)) {
                        if (Math.hypot(sx - tp.x, sz - tp.z) <= tp.md * 0.78) {
                            covered = true;
                            break;
                        }
                    }
                }
                if (covered) activeIndices.push(i);
            }

            if (activeIndices.length === 0) return new THREE.Group();

            const spans = [];
            let curSpan = [activeIndices[0]];
            for (let k = 1; k < activeIndices.length; k++) {
                if (activeIndices[k] <= activeIndices[k - 1] + 3) {
                    curSpan.push(activeIndices[k]);
                } else {
                    spans.push([ curSpan[0], curSpan[curSpan.length - 1] ]);
                    curSpan = [activeIndices[k]];
                }
            }
            spans.push([ curSpan[0], curSpan[curSpan.length - 1] ]);

            const resultGrp = new THREE.Group();

            spans.forEach(([startIdx, endIdx]) => {
                const segCount = Math.max(2, endIdx - startIdx);
                const geo = new THREE.BufferGeometry();
                const vertices = [];
                const colors = [];
                const indices = [];

                const minAngle = -0.18 * Math.PI;
                const maxAngle = 1.18 * Math.PI;

                for (let step = 0; step <= segCount; step++) {
                    const i = startIdx + step;
                    const uFrac = i / uSteps;
                    const spineIdx = uFrac * (spinePoints.length - 1);
                    const i0 = Math.floor(spineIdx);
                    const i1 = Math.min(spinePoints.length - 1, i0 + 1);
                    const r = spineIdx - i0;

                    const sx = spinePoints[i0].x + r * (spinePoints[i1].x - spinePoints[i0].x);
                    const sz = spinePoints[i0].z + r * (spinePoints[i1].z - spinePoints[i0].z);
                    const nx = spinePoints[i0].nx + r * (spinePoints[i1].nx - spinePoints[i0].nx);
                    const nz = spinePoints[i0].nz + r * (spinePoints[i1].nz - spinePoints[i0].nz);
                    const nLen = Math.hypot(nx, nz) || 1;
                    const unx = nx / nLen, unz = nz / nLen;

                    let marginWave = 0;
                    let rootEminence = 0;
                    let edentulousDip = 0;

                    jawPoses.forEach(tp => {
                        const dist = Math.hypot(sx - tp.x, sz - tp.z);
                        const radius = tp.md * 0.56;
                        if (dist < radius * 1.35) {
                            const normD = dist / radius;
                            if (targetFdiSet.has(tp.fdi)) {
                                if (normD < 1.0) {
                                    marginWave -= Math.cos(normD * Math.PI * 0.5) * 0.08;
                                    rootEminence += Math.cos(normD * Math.PI * 0.5) * 0.08;
                                } else if (normD < 1.32) {
                                    marginWave += Math.sin(((normD - 1.0) / 0.32) * Math.PI) * 0.11;
                                }
                                if (normD < 1.15) {
                                    edentulousDip += Math.cos(normD * Math.PI * 0.42) * 0.18;
                                }
                            }
                        }
                    });

                    const spanFrac = step / segCount;
                    const endTaper = (spanFrac < 0.08)
                        ? (spanFrac / 0.08)
                        : ((spanFrac > 0.92) ? ((1 - spanFrac) / 0.08) : 1.0);
                    const smoothEnd = Math.pow(Math.max(0.05, endTaper), 0.5);

                    for (let j = 0; j <= vSteps; j++) {
                        const vFrac = j / vSteps;
                        const angle = minAngle + vFrac * (maxAngle - minAngle);
                        const sinA = Math.sin(angle);
                        const cosA = Math.cos(angle);

                        const borderTaper = Math.sin(vFrac * Math.PI);
                        const localOffset = shellThick * (0.25 + 0.75 * Math.pow(borderTaper, 0.6)) * smoothEnd;

                        let halfThick = 0.68 * (0.85 + 0.22 * Math.max(0, -sinA));
                        if (cosA > 0.2 && sinA > -0.4 && sinA < 0.75) {
                            halfThick += rootEminence * cosA * Math.sin(((sinA + 0.4) / 1.15) * Math.PI);
                        }
                        halfThick += localOffset;

                        let localY = -0.78 + 0.82 * sinA;
                        if (sinA > 0.25) {
                            const topWeight = (sinA - 0.25) / 0.75;
                            localY += topWeight * (marginWave * (0.6 + 0.4 * Math.abs(cosA)) - edentulousDip * 0.65);
                        }
                        localY += sinA * localOffset * 0.85;

                        const py = isUpper ? (2.63 - localY) : localY;
                        const px = sx + unx * (cosA * halfThick);
                        const pz = sz + unz * (cosA * halfThick);
                        vertices.push(px, py, pz);

                        const crestFactor = Math.max(0, (sinA + 0.2) / 1.2);
                        const gr = 0.78 + crestFactor * 0.11;
                        const gg = 0.21 + crestFactor * 0.15;
                        const gb = 0.28 + crestFactor * 0.16;
                        colors.push(gr, gg, gb);
                    }
                }

                for (let i = 0; i < segCount; i++) {
                    for (let j = 0; j < vSteps; j++) {
                        const a = i * (vSteps + 1) + j;
                        const b = (i + 1) * (vSteps + 1) + j;
                        const c = (i + 1) * (vSteps + 1) + (j + 1);
                        const d = i * (vSteps + 1) + (j + 1);
                        if (isUpper) {
                            indices.push(a, d, b);
                            indices.push(b, d, c);
                        } else {
                            indices.push(a, b, d);
                            indices.push(b, c, d);
                        }
                    }
                }

                geo.setIndex(indices);
                geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                geo.computeVertexNormals();

                const mesh = new THREE.Mesh(geo, matPinkAcrylic);
                resultGrp.add(mesh);
            });

            return resultGrp;
        }
