        function buildExactFitCustomRestorationMesh(spec, prepSubType) {
            const radialSegs = 64;
            const heightSegs = 40;
            const srcGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.0, radialSegs, heightSegs, false);
            const posAttr = srcGeo.attributes.position;
            const srcIndex = srcGeo.index.array;
            const vCount = posAttr.count;

            const outerPts = new Array(vCount);
            const innerPts = new Array(vCount);
            const isPreparedVert = new Uint8Array(vCount);

            const v = new THREE.Vector3();
            for (let i = 0; i < vCount; i++) {
                v.fromBufferAttribute(posAttr, i);
                const u = Math.max(0.001, Math.min(0.999, v.y + 0.5));
                const theta = Math.atan2(v.z, v.x);

                const pIntact = evaluateAnatomicalToothVertex(u, theta, spec, 'none', true, false);
                const pPrep = evaluateAnatomicalToothVertex(u, theta, spec, prepSubType, false, false);

                const diff = Math.hypot(pIntact.x - pPrep.x, pIntact.y - pPrep.y, pIntact.z - pPrep.z);
                if (diff > 0.003) {
                    isPreparedVert[i] = 1;
                }
                outerPts[i] = pIntact;
                innerPts[i] = isPreparedVert[i] ? pPrep : pIntact;
            }

            const positions = [];
            const colors = [];
            const indices = [];
            const outerMap = new Int32Array(vCount).fill(-1);
            const innerMap = new Int32Array(vCount).fill(-1);
            let nextIdx = 0;

            function getOuterIdx(vi) {
                if (outerMap[vi] === -1) {
                    const p = outerPts[vi];
                    positions.push(p.x * 1.002, p.y + 0.0015, p.z * 1.002);
                    colors.push(p.r, p.g, p.b);
                    outerMap[vi] = nextIdx++;
                }
                return outerMap[vi];
            }

            function getInnerIdx(vi) {
                if (innerMap[vi] === -1) {
                    const p = innerPts[vi];
                    positions.push(p.x * 0.999, p.y + 0.0005, p.z * 0.999);
                    colors.push(p.r * 0.92, p.g * 0.90, p.b * 0.85);
                    innerMap[vi] = nextIdx++;
                }
                return innerMap[vi];
            }

            for (let t = 0; t < srcIndex.length; t += 3) {
                const a = srcIndex[t];
                const b = srcIndex[t + 1];
                const c = srcIndex[t + 2];
                if (isPreparedVert[a] || isPreparedVert[b] || isPreparedVert[c]) {
                    const oa = getOuterIdx(a);
                    const ob = getOuterIdx(b);
                    const oc = getOuterIdx(c);
                    indices.push(oa, ob, oc);

                    const ia = getInnerIdx(a);
                    const ib = getInnerIdx(b);
                    const ic = getInnerIdx(c);
                    indices.push(ia, ic, ib);
                }
            }

            const outGeo = new THREE.BufferGeometry();
            outGeo.setIndex(indices);
            outGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            outGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            outGeo.computeVertexNormals();

            const mat = getActiveRestorationMaterial(true);
            const grp = new THREE.Group();
            grp.add(new THREE.Mesh(outGeo, mat));
            return grp;
        }

        function buildVeneerShellForPose(spec) {
            return buildExactFitCustomRestorationMesh(spec, 'veneer');
        }

        function buildInlayPieceForPose(spec) {

        }

        function buildThreeArmClaspForPose(spec, edentulousDirX = 1) {
            const grp = new THREE.Group();
            const dir = edentulousDirX >= 0 ? 1 : -1;

            function surfaceVec(u, theta, radialOut = 0.014, yAdd = 0) {
                const p = evaluateAnatomicalToothVertex(u, theta, spec, 'none', false, false);
                const rLen = Math.hypot(p.x, p.z) || 1;
                return new THREE.Vector3(
                    p.x + (p.x / rLen) * radialOut,
                    p.y + yAdd,
                    p.z + (p.z / rLen) * radialOut
                );
            }

            function createTaperedCastArmMesh(curve, rStart, rEnd, radialFlatten = 0.65) {
                const tubularSegments = 28;
                const radialSegments = 12;
                const tubeGeo = new THREE.TubeGeometry(curve, tubularSegments, rStart, radialSegments, false);
                const pos = tubeGeo.attributes.position;
                const centerPt = new THREE.Vector3();
                const v = new THREE.Vector3();

                for (let i = 0; i <= tubularSegments; i++) {
                    const t = i / tubularSegments;
                    curve.getPointAt(t, centerPt);
                    const scale = (rStart * (1 - t) + rEnd * t) / rStart;

                    for (let j = 0; j <= radialSegments; j++) {
                        const idx = i * (radialSegments + 1) + j;
                        v.fromBufferAttribute(pos, idx);
                        const dx = (v.x - centerPt.x) * scale;
                        const dy = (v.y - centerPt.y) * scale * 1.15;
                        const dz = (v.z - centerPt.z) * scale * radialFlatten;
                        pos.setXYZ(idx, centerPt.x + dx, centerPt.y + dy, centerPt.z + dz);
                    }
                }
                tubeGeo.computeVertexNormals();
                return new THREE.Mesh(tubeGeo, matCoCrFramework);
            }

            const proxTheta = dir > 0 ? 0.0 : Math.PI;

            const restRim = surfaceVec(0.86, proxTheta, 0.005, 0.01);
            const restMid = surfaceVec(0.83, proxTheta, -0.09 * spec.md, 0.025);
            const restTip = surfaceVec(0.80, proxTheta, -0.22 * spec.md, 0.015);
            const restCurve = new THREE.CatmullRomCurve3([restRim, restMid, restTip]);
            const restGeo = new THREE.TubeGeometry(restCurve, 14, 0.068 * spec.fl, 12, false);
            restGeo.scale(1.0, 0.42, 1.35);
            grp.add(new THREE.Mesh(restGeo, matCoCrFramework));

            const shoulderTop = surfaceVec(0.84, proxTheta, 0.016, 0.0);
            const shoulderMid = surfaceVec(0.58, proxTheta, 0.020, 0.0);
            const minorBase = surfaceVec(0.24, proxTheta - dir * 0.22, 0.028, -0.06);
            const saddleJoin = new THREE.Vector3(
                shoulderMid.x + dir * 0.14 * spec.md,
                -0.30,
                -spec.fl * 0.34
            );
            const minorCurve = new THREE.CatmullRomCurve3([shoulderTop, shoulderMid, minorBase, saddleJoin]);
            grp.add(createTaperedCastArmMesh(minorCurve, 0.046, 0.052, 0.85));

            const buccalPts = [];
            const armSteps = 18;
            for (let i = 0; i <= armSteps; i++) {
                const t = i / armSteps;
                const theta = dir > 0
                    ? (0.06 + t * (Math.PI * 0.82))
                    : (Math.PI - 0.06 - t * (Math.PI * 0.82));
                const u = 0.74 - 0.18 * Math.pow(t, 0.65) - 0.22 * Math.pow(t, 1.85);
                buccalPts.push(surfaceVec(u, theta, 0.013, 0));
            }
            const buccalCurve = new THREE.CatmullRomCurve3(buccalPts);
            grp.add(createTaperedCastArmMesh(buccalCurve, 0.042, 0.021, 0.62));

            const lingualPts = [];
            for (let i = 0; i <= armSteps; i++) {
                const t = i / armSteps;
                const theta = dir > 0
                    ? (-0.06 - t * (Math.PI * 0.78))
                    : (-Math.PI + 0.06 + t * (Math.PI * 0.78));
                const u = 0.72 - 0.20 * Math.sin(t * Math.PI * 0.58);
                lingualPts.push(surfaceVec(u, theta, 0.014, 0));
            }
            const lingualCurve = new THREE.CatmullRomCurve3(lingualPts);
            grp.add(createTaperedCastArmMesh(lingualCurve, 0.045, 0.034, 0.68));

            return grp;
        }

        function buildExtractableDecayedToothMesh(spec) {
            const grp = new THREE.Group();
            const brokenCrown = createArchToothMesh(spec, 'none', false, null, true, true);
            brokenCrown.scale.set(0.84, 0.45, 0.84);
            brokenCrown.position.y = -0.24 * spec.h;
            const roots = createToothRootMesh(spec);
            grp.add(brokenCrown, roots);
            return grp;
        }

            fdiLabelAnchors.forEach((item, idx) => {

                el.className = `absolute -translate-x-1/2 -translate-y-full px-1.5 py-0.5 rounded-md text-[10px] font-extrabold shadow-md border whitespace-nowrap transition-opacity duration-75 ${item.badgeClass}`;

        function updateFdi3DLabelsScreenPosition() {
            if (!showFdi3DLabels || !camera || fdiLabelAnchors.length === 0) return;
            const proj = new THREE.Vector3();
            const w = window.innerWidth;
            const h = window.innerHeight;
            fdiLabelAnchors.forEach(item => {
                if (!item.domEl) return;
                proj.copy(item.worldPos).project(camera);
                if (proj.z > 1.0 || proj.z < -1.0) {
                    item.domEl.style.opacity = '0';
                    return;
                }
                const sx = (proj.x * 0.5 + 0.5) * w;
                const sy = (-proj.y * 0.5 + 0.5) * h;
                item.domEl.style.left = `${sx}px`;
                item.domEl.style.top = `${sy}px`;
                item.domEl.style.opacity = '0.92';
            });
        }

            } else if (currentMainMode === 'implant') {

                if (activeJawView === 'upper') {

                    roles[25] = 'rpd_pontic';

                    roles[15] = 'rpd_pontic';

                    roles[34] = 'rpd_clasp';
                    roles[44] = 'rpd_clasp';
                    roles[35] = 'rpd_pontic';
                    roles[36] = 'rpd_pontic';

                    roles[45] = 'rpd_pontic';

        function rebuildScene() {
            clear3DScene();
            const crownMat = getActiveRestorationMaterial(false);
            const roles = getActiveArchRoles();
            const visibleFdis = getVisibleFdiList();

            // SPECIAL EDUCATIONAL MODE A: 缺牙长期不修复并发症动画 (邻牙牙冠向缺牙间隙倾斜 + 对颌牙伸长 + 牙槽骨进行性吸收)
            if (currentMainMode === 'unrestored_hazard') {
                const missingFdis = [36];
                // Realistic moderate disuse alveolar bone atrophy at #36 edentulous site
                rootGroup.add(buildFullMandibularGingivaAndTongue(missingFdis, [
                    { fdi: 36, vert: 0.22, horiz: 0.11, heat: 0.72, radiusMul: 1.32 }
                ]));

                const p36 = archPoses[36];
                registerFdiLabel(36, '长期缺牙·牙槽骨进行性吸收萎缩', 'bg-rose-950/90 text-rose-200 border-rose-400', p36);

                visibleFdis.forEach(fdi => {
                    if (fdi === 36) return;
                    const pose = archPoses[fdi];

                    if (fdi === 37 || fdi === 35) {
                        // World-space root-apex pivot so the CROWN (+Y) tips unambiguously toward #36 edentulous space!
                        const pivotY = pose.y - 0.65;
                        const worldPivot = new THREE.Group();
                        worldPivot.position.set(pose.x, pivotY, pose.z);
                        rootGroup.add(worldPivot);

                        const toothLocal = new THREE.Group();
                        toothLocal.position.set(0, 0.65, 0);
                        toothLocal.rotation.y = pose.rotY;
                        worldPivot.add(toothLocal);

                        const natMesh = createArchToothMesh(pose, 'none', false, null, true, false);
                        toothLocal.add(natMesh);
                        toothLocal.add(createToothRootMesh(pose));

                        // Horizontal unit vector in WORLD space pointing from this tooth (35 or 37) directly toward #36
                        const gapDirWorld = new THREE.Vector3(p36.x - pose.x, 0, p36.z - pose.z).normalize();

                        hazardAnimNodes.push({
                            type: 'crown_tilt_to_gap_world',
                            worldPivot: worldPivot,
                            basePivotPos: new THREE.Vector3(pose.x, pivotY, pose.z),
                            gapDirWorld: gapDirWorld,
                            // Subtle, clinically realistic mesial/distal crown tipping (~7.5° to 9°)
                            maxAngle: fdi === 37 ? 0.16 : 0.13
                        });

                        if (fdi === 37) {
                            registerFdiLabel(37, '37牙冠向36缺隙近中微倾', 'bg-amber-950/90 text-amber-200 border-amber-400', pose);
                        } else {

                registerFdiLabel(36, '36悬臂桥体：无基牙支撑·传导杠杆力', 'bg-amber-950/90 text-amber-200 border-amber-400', p36);
                registerFdiLabel(37, '37游离端桥体：咀嚼力下压产生撬动', 'bg-amber-950/90 text-amber-200 border-amber-400', p37);

            const missingFdis = visibleFdis.filter(fdi =>
                roles[fdi] === 'pontic' || roles[fdi] === 'implant' || roles[fdi] === 'rpd_pontic' ||

            );

            const isAllComplete = visibleFdis.length > 0 && visibleFdis.every(fdi => roles[fdi] === 'complete_unit');
            if (currentMainMode === 'complete' || isAllComplete) {
                const buildCompleteArchDenture = (fdiList, spinePts, isUpperJaw) => {
                    const fullDentureGrp = new THREE.Group();

            let missingCount = 0;
            let grindCount = 0;
            let wearCount = 0;
            let implantCount = 0;
            let claspCount = 0;
            let extractCount = 0;
            const rpdGroup = new THREE.Group();
            let hasRpd = false;

            function isIsolatedSingleAbutment(fdi) {
                if (currentMainMode === 'single') return true;
                const jawArr = archPoses[fdi].isUpper ? UPPER_ARCH_FDI : LOWER_ARCH_FDI;
                const idx = jawArr.indexOf(fdi);
                const prevFdi = idx > 0 ? jawArr[idx - 1] : null;
                const nextFdi = idx < jawArr.length - 1 ? jawArr[idx + 1] : null;
                const neighborInBridge = [prevFdi, nextFdi].some(n =>
                    n && (roles[n] === 'pontic' || roles[n] === 'abutment')
                );
                return !neighborInBridge;
            }

            function getEdentulousDirectionX(fdi) {
                const pose = archPoses[fdi];
                const isMissingRole = (r) =>
                    r === 'rpd_pontic' || r === 'pontic' || r === 'implant' || r === 'missing_only' || r === 'extract';
                const distalFdi = pose.quad * 10 + (pose.num + 1);
                const mesialFdi = pose.num > 1 ? (pose.quad * 10 + (pose.num - 1)) : null;

                let towardDistal = true;
                if (roles[distalFdi] && isMissingRole(roles[distalFdi])) {
                    towardDistal = true;
                } else if (mesialFdi && roles[mesialFdi] && isMissingRole(roles[mesialFdi])) {
                    towardDistal = false;
                } else {
                    const jawArr = pose.isUpper ? UPPER_ARCH_FDI : LOWER_ARCH_FDI;
                    let bestDist = Infinity;
                    jawArr.forEach(otherFdi => {
                        if (isMissingRole(roles[otherFdi])) {
                            const d = Math.abs(archPoses[otherFdi].num - pose.num);
                            if (d < bestDist) {
                                bestDist = d;
                                towardDistal = archPoses[otherFdi].num > pose.num;
                            }
                        }
                    });
                }
                const distalLocalSign = pose.sign > 0 ? -1 : 1;
                return towardDistal ? distalLocalSign : -distalLocalSign;
            }

            visibleFdis.forEach(fdi => {
                const role = roles[fdi];
                const pose = archPoses[fdi];
                const spec = pose;

                const anchor = new THREE.Group();
                anchor.position.set(pose.x, pose.y, pose.z);
                anchor.rotation.y = pose.rotY;
                if (pose.isUpper) anchor.scale.y = -1;

                if (role === 'normal' || role === 'rpd_clasp') {
                    const natMesh = createArchToothMesh(spec, 'none', false, null, true, false);
                    natMesh.userData.fdi = fdi;

                    anchor.add(natMesh);

                    anchor.add(roots);

                } else if (role === 'abutment') {

                    wearCount++;

                    const abutMesh = createArchToothMesh(spec, prepType, false, null, true, showCariesLesion);
                    abutMesh.userData.fdi = fdi;
                    abutMesh.userData.worldPose = pose;
                    clickableMeshes.push(abutMesh);
                    anchor.add(abutMesh);

                    const roots = createToothRootMesh(spec, isPostCore);
                    anchor.add(roots);

                        const postCoreNode = buildPostAndCoreNode(spec);

                        anchor.add(postCoreNode);
                        animatedProstheses.push({

                        });

                    const subLabelMap = { crown: '全冠基牙', post_core: '桩核冠修复', veneer: '贴面基牙', inlay: '嵌体基牙' };
                    registerFdiLabel(fdi, isSingle ? (subLabelMap[prepType] || '基牙') : '固定桥基牙', 'bg-amber-950/90 text-amber-200 border-amber-400', pose);
                } else if (role === 'pontic') {
                    missingCount++;
                    wearCount++;

                        startPos: new THREE.Vector3(0, 0, 0),

                        maxT: 32,

                } else if (role === 'implant') {

                    implantCount++;
                    wearCount++;
                    const { fixtureGrp, abutmentGrp, crownMesh } = buildImplantThreeStageNodes(pose, crownMat);

                    fixtureGrp.userData.fdi = fdi;
                    abutmentGrp.userData.fdi = fdi;
                    crownMesh.userData.fdi = fdi;
                    clickableMeshes.push(fixtureGrp, abutmentGrp, crownMesh);

                    anchor.add(fixtureGrp, abutmentGrp, crownMesh);

                    animatedProstheses.push({
                        mesh: fixtureGrp,
                        startPos: new THREE.Vector3(0, 1.35, 0),

                    });
                    animatedProstheses.push({
                        mesh: abutmentGrp,
                        startPos: new THREE.Vector3(0, 1.85, 0),
                        endPos: new THREE.Vector3(0, -0.06, 0),

                    });
                    animatedProstheses.push({
                        mesh: crownMesh,
                        startPos: new THREE.Vector3(0, 2.35, 0),
                        endPos: new THREE.Vector3(0, 0.02, 0),
                        minT: 70, maxT: 100
                    });
                    registerFdiLabel(fdi, '种植义齿', 'bg-emerald-950/90 text-emerald-200 border-emerald-400', pose);
                } else if (role === 'rpd_pontic') {
                    hasRpd = true;
                    missingCount++;
                    wearCount++;
                    const rUnit = new THREE.Group();
                    rUnit.position.set(pose.x, pose.y, pose.z);
                    rUnit.rotation.y = pose.rotY;
                    if (pose.isUpper) rUnit.scale.y = -1;

                    rUnit.add(dt);
                    rpdGroup.add(rUnit);

            if (hasRpd) {

                    if (upperRpdFdis.size > 0) {

                const barPts = [];
                for (let k = 16; k <= 48; k += 2) {

                    if (sp) barPts.push(new THREE.Vector3(sp.x * 0.78, -0.28, sp.z - 0.36));

                        rpdGroup.add(rest);

                rootGroup.add(rpdGroup);
                animatedProstheses.push({
                    mesh: rpdGroup,
                    startPos: new THREE.Vector3(0, 2.5, 0),
                    endPos: new THREE.Vector3(0, 0, 0),

            const flushBridgeSpan = (s) => {
                if (s.length === 0) return;
                const isUpperSpan = archPoses[s[0]].isUpper;
                const ySign = isUpperSpan ? -1 : 1;

                if (s.length >= 2 && bridgeConnectorType === 'nonrigid') {
                    const firstFdi = s[0];
                    const fp = archPoses[firstFdi];

                    const minorGrp = new THREE.Group();
                    const c1 = createArchToothMesh(fp, 'none', true, crownMat, false);
                    c1.position.set(fp.x, fp.y, fp.z);
                    c1.rotation.y = fp.rotY;
                    if (fp.isUpper) c1.scale.y = -1;
                    c1.userData.fdi = firstFdi;
                    clickableMeshes.push(c1);
                    minorGrp.add(c1);

                    const nextP = archPoses[s[1]];
                    const keyway = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.36, 0.28), matKeywayBlue);
                    keyway.position.set((fp.x + nextP.x) * 0.5, fp.y + 0.05 * ySign, (fp.z + nextP.z) * 0.5);
                    minorGrp.add(keyway);

                    rootGroup.add(minorGrp);
                    animatedProstheses.push({
                        mesh: minorGrp,
                        startPos: new THREE.Vector3(0, 2.2 * ySign, 0),
                        endPos: new THREE.Vector3(0, 0.02 * ySign, 0),
                        minT: 38, maxT: 68
                    });

                    const majorGrp = new THREE.Group();
                    for (let idx = 1; idx < s.length; idx++) {
                        const fdi = s[idx];
                        const p = archPoses[fdi];
                        const bridgeSpec = { ...p, md: p.md * 1.03 };
                        const isPonticUnit = (roles[fdi] === 'pontic');
                        const uMesh = createArchToothMesh(bridgeSpec, 'none', true, crownMat, false, false, isPonticUnit);
                        uMesh.position.set(p.x, p.y, p.z);
                        uMesh.rotation.y = p.rotY;
                        if (p.isUpper) uMesh.scale.y = -1;
                        uMesh.userData.fdi = fdi;
                        clickableMeshes.push(uMesh);
                        majorGrp.add(uMesh);
                    }
                    const maleKey = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.38, 16), matGoldRestoration);
                    maleKey.position.set((fp.x + nextP.x) * 0.5, fp.y + 0.05 * ySign, (fp.z + nextP.z) * 0.5);
                    majorGrp.add(maleKey);

                    rootGroup.add(majorGrp);
                    animatedProstheses.push({
                        mesh: majorGrp,
                        startPos: new THREE.Vector3(0, 2.4 * ySign, 0),
                        endPos: new THREE.Vector3(0, 0.02 * ySign, 0),
                        minT: 68, maxT: 100
                    });
                    return;
                }

                const bridgeGrp = new THREE.Group();
                let isHorizVeneer = false;
                let hasPostCoreInSpan = false;

                s.forEach((fdi) => {
                    const p = archPoses[fdi];
                    const spc = s.length > 1 ? { ...p, md: p.md * 1.035 } : p;
                    const toothSubType = getToothPrepSubType(fdi);
                    const isPonticUnit = (roles[fdi] === 'pontic');
                    let unitMesh;

                    if (s.length === 1 && toothSubType === 'veneer') {
                        unitMesh = buildVeneerShellForPose(spc);
                        isHorizVeneer = true;
                    } else if (s.length === 1 && toothSubType === 'inlay') {
                        unitMesh = buildInlayPieceForPose(spc);
                    } else {
                        if (s.length === 1 && toothSubType === 'post_core') {
                            hasPostCoreInSpan = true;
                        }
                        // Pass isPonticUnit so pontic teeth have a 100% solid closed bottom without any hole!
                        unitMesh = createArchToothMesh(spc, 'none', true, crownMat, false, false, isPonticUnit);
                    }

                    unitMesh.position.set(p.x, p.y, p.z);
                    unitMesh.rotation.y = p.rotY;
                    if (p.isUpper) unitMesh.scale.y = -1;
                    unitMesh.userData.fdi = fdi;
                    clickableMeshes.push(unitMesh);
                    bridgeGrp.add(unitMesh);
                });

                rootGroup.add(bridgeGrp);
                const startOffset = isHorizVeneer
                    ? new THREE.Vector3(0, 0.15 * ySign, 1.35)
                    : new THREE.Vector3(0, 1.85 * ySign, 0);

                animatedProstheses.push({
                    mesh: bridgeGrp,
                    startPos: startOffset,
                    endPos: new THREE.Vector3(0, 0.0, 0),
                    minT: hasPostCoreInSpan ? 69 : 38,
                    maxT: 100
                });
            };

            [UPPER_ARCH_FDI, LOWER_ARCH_FDI].forEach(jawList => {
                let span = [];
                jawList.forEach(fdi => {
                    if (!visibleFdis.includes(fdi)) return;
                    const r = roles[fdi];
                    if (r === 'abutment' || r === 'pontic') {
                        span.push(fdi);
                    } else {
                        flushBridgeSpan(span);
                        span = [];
                    }
                });
                flushBridgeSpan(span);
            });

            let badge = `缺${missingCount}·磨${grindCount}·戴${wearCount}`;
            if (extractCount > 0) badge += `·拔${extractCount}`;
            if (implantCount > 0) badge += `·种${implantCount}`;
            if (claspCount > 0) badge += `·卡${claspCount}`;

            let timelineModeType = 'default';
            if (currentMainMode === 'implant') {
                timelineModeType = 'implant';
            } else if (currentMainMode === 'single' && singleSubType === 'post_core') {
                timelineModeType = 'post_core';

                timelineModeType = 'post_core';

            if (currentMainMode === 'single') {

                badge = bridgeConnectorType === 'rigid' ? '固定桥 (缺1磨2戴3)' : '活动栓道桥 (缺1磨2戴3)';
            } else if (currentMainMode === 'implant') {

            } else if (currentMainMode === 'rpd') {
                badge = `活动义齿 (缺${missingCount}戴${wearCount}卡${claspCount})`;
            }
            updateClinicalCounter(missingCount, grindCount, wearCount, implantCount, claspCount, extractCount, badge);
            updateTimelineButtonsUI(timelineModeType);
            updateGumOpacity();
            renderFdi3DLabelsDOM();

        function applyTimelineState(val) {
            timelineVal = Number(val);
            const slider = document.getElementById('master-timeline');
            if (slider) slider.value = timelineVal;

            // Morph Dynamic Alveolar Bone Resorption:
            // In 'cantilever_hazard' mode, bone resorption ONLY starts AFTER the bridge is fully seated (timelineVal > 35%) and occlusal force is applied!
            if (dynamicBoneMeshes.length > 0) {
                let boneP = 0;
                if (currentMainMode === 'cantilever_hazard') {
                    boneP = timelineVal <= 35 ? 0 : Math.max(0, Math.min(1, (timelineVal - 35) / 65));
                } else {
                    boneP = Math.max(0, Math.min(1, timelineVal / 100));
                }
                const smoothBone = boneP * boneP * (3 - 2 * boneP);
                dynamicBoneMeshes.forEach(bm => {
                    const posAttr = bm.mesh.geometry.attributes.position;
                    const colAttr = bm.mesh.geometry.attributes.color;
                    const vCount = posAttr.count;
                    for (let i = 0; i < vCount; i++) {
                        const idx = i * 3;
                        posAttr.array[idx]     = bm.intactPos[idx]     + (bm.resorbedPos[idx]     - bm.intactPos[idx])     * smoothBone;
                        posAttr.array[idx + 1] = bm.intactPos[idx + 1] + (bm.resorbedPos[idx + 1] - bm.intactPos[idx + 1]) * smoothBone;
                        posAttr.array[idx + 2] = bm.intactPos[idx + 2] + (bm.resorbedPos[idx + 2] - bm.intactPos[idx + 2]) * smoothBone;

                        colAttr.array[idx]     = bm.intactCol[idx]     + (bm.resorbedCol[idx]     - bm.intactCol[idx])     * smoothBone;
                        colAttr.array[idx + 1] = bm.intactCol[idx + 1] + (bm.resorbedCol[idx + 1] - bm.intactCol[idx + 1]) * smoothBone;
                        colAttr.array[idx + 2] = bm.intactCol[idx + 2] + (bm.resorbedCol[idx + 2] - bm.intactCol[idx + 2]) * smoothBone;
                    }
                    posAttr.needsUpdate = true;
                    colAttr.needsUpdate = true;
                    bm.mesh.geometry.computeVertexNormals();
                });
            }

            if (hazardAnimNodes.length > 0) {
                const progress = Math.max(0, Math.min(1, timelineVal / 100));
                const smoothP = progress * progress * (3 - 2 * progress);
                const upVec = new THREE.Vector3(0, 1, 0);

                hazardAnimNodes.forEach(node => {
                    if (node.type === 'crown_tilt_to_gap_world') {
                        const theta = node.maxAngle * smoothP;
                        const targetUp = new THREE.Vector3(
                            node.gapDirWorld.x * Math.sin(theta),
                            Math.cos(theta),
                            node.gapDirWorld.z * Math.sin(theta)
                        ).normalize();
                        node.worldPivot.quaternion.setFromUnitVectors(upVec, targetUp);
                        node.worldPivot.position.set(
                            node.basePivotPos.x + node.gapDirWorld.x * 0.025 * smoothP,
                            node.basePivotPos.y - 0.015 * smoothP,
                            node.basePivotPos.z + node.gapDirWorld.z * 0.025 * smoothP
                        );
                    } else if (node.type === 'extrude_26') {
                        node.group.position.y = node.baseY - 0.26 * smoothP;
                    } else if (node.type === 'cantilever_world') {
                        if (timelineVal <= 18) {
                            // Sub-stage 1 (0%..18%): Grinding #35 abutment tooth
                            node.bridgeGroup.visible = false;
                            node.arrowGroup.visible = false;
                            node.pivotGroup.quaternion.identity();
                            node.pivotGroup.position.copy(node.basePivotPos);
                            node.traumaHalo.material.opacity = 0;
                        } else if (timelineVal <= 35) {
                            // Sub-stage 2 (18%..35%): Vertical seating of the 35-36-37 cantilever bridge so at 35% (Step ②) it is 100% seated!
                            node.bridgeGroup.visible = true;
                            node.arrowGroup.visible = false;
                            const seatT = (timelineVal - 18) / 17;
                            const easeSeat = seatT * seatT * (3 - 2 * seatT);
                            node.bridgeGroup.position.set(0, 1.85 * (1 - easeSeat), 0);
                            node.pivotGroup.quaternion.identity();
                            node.pivotGroup.position.copy(node.basePivotPos);
                            node.traumaHalo.material.opacity = 0;
                        } else {
                            // Stage 3 & 4 (35%..100%): Bridge is seated; occlusal force on 36 & 37 causes distal tipping of #35, periodontal trauma & bone resorption
                            node.bridgeGroup.visible = true;
                            node.bridgeGroup.position.set(0, 0, 0);
                            node.arrowGroup.visible = true;

                            const loadT = (timelineVal - 35) / 65;
                            const easeLoad = loadT * loadT * (3 - 2 * loadT);
                            const tiltAngle = easeLoad * 0.115;

                            const targetUp = new THREE.Vector3(
                                node.distalDirWorld.x * Math.sin(tiltAngle),
                                Math.cos(tiltAngle),
                                node.distalDirWorld.z * Math.sin(tiltAngle)
                            ).normalize();
                            node.pivotGroup.quaternion.setFromUnitVectors(upVec, targetUp);

                            node.pivotGroup.position.set(
                                node.basePivotPos.x + node.distalDirWorld.x * (0.025 * easeLoad),
                                node.basePivotPos.y - 0.022 * easeLoad,
                                node.basePivotPos.z + node.distalDirWorld.z * (0.025 * easeLoad)
                            );

                            node.arrowGroup.position.y = -0.08 * easeLoad;
                            node.traumaHalo.material.opacity = Math.min(0.68, easeLoad * 0.68);
                        }
                    }
                });
            }

            const prepMaxT = (currentMainMode === 'cantilever_hazard') ? 18 : 35;
            const prepT = Math.max(0, Math.min(1, timelineVal / prepMaxT));
            const smoothPrep = prepT * prepT * (3 - 2 * prepT);

            morphableTeeth.forEach(item => {
                const posAttr = item.mesh.geometry.attributes.position;
                const colAttr = item.mesh.geometry.attributes.color;
                const count = posAttr.count;
                for (let i = 0; i < count; i++) {
                    const idx = i * 3;
                    posAttr.array[idx]     = item.intactPos[idx]     + (item.preppedPos[idx]     - item.intactPos[idx])     * smoothPrep;
                    posAttr.array[idx + 1] = item.intactPos[idx + 1] + (item.preppedPos[idx + 1] - item.intactPos[idx + 1]) * smoothPrep;
                    posAttr.array[idx + 2] = item.intactPos[idx + 2] + (item.preppedPos[idx + 2] - item.intactPos[idx + 2]) * smoothPrep;

                    colAttr.array[idx]     = item.intactCol[idx]     + (item.preppedCol[idx]     - item.intactCol[idx])     * smoothPrep;
                    colAttr.array[idx + 1] = item.intactCol[idx + 1] + (item.preppedCol[idx + 1] - item.intactCol[idx + 1]) * smoothPrep;
                    colAttr.array[idx + 2] = item.intactCol[idx + 2] + (item.preppedCol[idx + 2] - item.intactCol[idx + 2]) * smoothPrep;
                }
                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
                item.mesh.geometry.computeVertexNormals();
            });

            if (burMesh && morphableTeeth.length > 0 && timelineVal >= 2 && timelineVal <= (prepMaxT - 1)) {
                burMesh.visible = true;
                const wp = morphableTeeth[0].mesh.userData.worldPose || { x: 0, y: 0.3, z: 0 };
                const spin = prepT * Math.PI * 8;
                burMesh.position.set(
                    wp.x + Math.cos(spin) * 0.38,
                    wp.y + 0.45,
                    wp.z + Math.sin(spin) * 0.38
                );
            } else if (burMesh) {
                burMesh.visible = false;
            }

            animatedProstheses.forEach(p => {
                if (p.hideAfterMax) {
                    if (timelineVal > p.maxT) {
                        p.mesh.visible = false;
                    } else {
                        p.mesh.visible = true;
                        const rawT = Math.max(0, Math.min(1, (timelineVal - p.minT) / Math.max(1, p.maxT - p.minT)));
                        const easeT = rawT * rawT * (3 - 2 * rawT);
                        p.mesh.position.lerpVectors(p.startPos, p.endPos, easeT);
                    }
                    return;
                }
                if (timelineVal < p.minT) {
                    p.mesh.visible = false;
                } else {
                    p.mesh.visible = true;
                    const rawT = Math.min(1, (timelineVal - p.minT) / Math.max(1, p.maxT - p.minT));
                    const easeT = rawT * rawT * (3 - 2 * rawT);
                    p.mesh.position.lerpVectors(p.startPos, p.endPos, easeT);
                }
            });

            const lbl = document.getElementById('timeline-status-label');
            if (lbl) {
                if (currentMainMode === 'unrestored_hazard') {
                    if (timelineVal === 0) lbl.textContent = '0% 刚缺牙状态';
                    else if (timelineVal <= 40) lbl.textContent = `${timelineVal}% 邻牙向缺隙倾倒`;
                    else if (timelineVal < 100) lbl.textContent = `${timelineVal}% 对颌牙伸长/塞牙`;
                    else lbl.textContent = '100% 咬合紊乱/骨吸收';
                } else if (currentMainMode === 'cantilever_hazard') {
                    if (timelineVal === 0) lbl.textContent = '0% 治疗前(36/37缺失)';
                    else if (timelineVal <= 18) lbl.textContent = `${timelineVal}% 磨小35号基牙`;
                    else if (timelineVal <= 35) lbl.textContent = `${timelineVal}% ② 单端固定桥已戴入`;
                    else if (timelineVal <= 68) lbl.textContent = `${timelineVal}% ③ 67受力·5向远中倾斜`;
                    else lbl.textContent = `${timelineVal}% ④ 牙周损伤与骨吸收`;
                } else if (currentMainMode === 'implant') {
                    if (timelineVal === 0) lbl.textContent = '0% 缺牙区待种植';
                    else if (timelineVal <= 35) lbl.textContent = `${timelineVal}% ① 植入种植体`;
                    else if (timelineVal <= 68) lbl.textContent = `${timelineVal}% ② 安装连接基台`;
                    else if (timelineVal < 100) lbl.textContent = `${timelineVal}% ③ 戴入上部牙冠`;
                    else lbl.textContent = '100% 种植修复完成';
                } else if ((currentMainMode === 'single' && singleSubType === 'post_core') ||
                           (currentMainMode === 'custom' && customSingleSubTypes[selectedCustomFdi] === 'post_core')) {
                    if (timelineVal === 0) lbl.textContent = '0% 根管治疗后残冠';
                    else if (timelineVal <= 35) lbl.textContent = `${timelineVal}% ① 残冠预备/桩道`;
                    else if (timelineVal <= 68) lbl.textContent = `${timelineVal}% ② 插入纤维桩核`;
                    else if (timelineVal < 100) lbl.textContent = `${timelineVal}% ③ 戴入上部全冠`;
                    else lbl.textContent = '100% 桩核冠修复完成';
                } else {
                    if (timelineVal === 0) lbl.textContent = '0% 治疗前原牙';
                    else if (timelineVal < 35) lbl.textContent = `${timelineVal}% 磨小基牙中...`;
                    else if (timelineVal <= 40) lbl.textContent = '35% 基牙预备完成';
                    else if (timelineVal < 100) lbl.textContent = `${timelineVal}% 假牙对位就位中`;
                    else lbl.textContent = '100% 戴牙修复完成';
                }
            }
        }

        function onTimelineInput(v) {
            if (isAutoPlaying) stopAutoPlayAnimation();
            applyTimelineState(v);
        }

        let activeAnimId = null;
        function stopAutoPlayAnimation() {
            isAutoPlaying = false;
            if (activeAnimId) {
                cancelAnimationFrame(activeAnimId);
                activeAnimId = null;
            }
            const icon = document.getElementById('autoplay-icon');
            const txt = document.getElementById('autoplay-text');
            const btn = document.getElementById('btn-autoplay');
            if (icon && txt && btn) {
                icon.className = 'fa-solid fa-play';
                txt.textContent = '自动播放';
                btn.className = 'cad-btn px-3 py-1.5 rounded-xl text-xs font-extrabold bg-emerald-600 hover:bg-emerald-500 text-white shadow flex items-center gap-1.5';
            }
        }

        function toggleAutoPlayAnimation() {
            if (isAutoPlaying) {
                stopAutoPlayAnimation();
                return;
            }
            isAutoPlaying = true;
            const icon = document.getElementById('autoplay-icon');
            const txt = document.getElementById('autoplay-text');
            const btn = document.getElementById('btn-autoplay');
            if (icon && txt && btn) {
                icon.className = 'fa-solid fa-pause';
                txt.textContent = '暂停动画';
                btn.className = 'cad-btn px-3 py-1.5 rounded-xl text-xs font-extrabold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow flex items-center gap-1.5';
            }

            if (timelineVal >= 98) applyTimelineState(0);
            const startVal = timelineVal;
            const totalDuration = 3800 * ((100 - startVal) / 100);
            const t0 = performance.now();

            function autoTick(now) {
                if (!isAutoPlaying) return;
                const elapsed = now - t0;
                const p = Math.min(1, elapsed / Math.max(300, totalDuration));
                const cur = Math.round(startVal + (100 - startVal) * p);
                applyTimelineState(cur);
                if (p < 1) {
                    activeAnimId = requestAnimationFrame(autoTick);
                } else {
                    stopAutoPlayAnimation();
                }
            }
            activeAnimId = requestAnimationFrame(autoTick);
        }

        function playToTimeline(targetVal, duration = 700) {
            stopAutoPlayAnimation();
            const startVal = timelineVal;
            const t0 = performance.now();
            function tick(now) {
                const p = Math.min(1, (now - t0) / duration);
                const ease = 1 - Math.pow(1 - p, 3);
                applyTimelineState(Math.round(startVal + (targetVal - startVal) * ease));
                if (p < 1) activeAnimId = requestAnimationFrame(tick);
            }
            activeAnimId = requestAnimationFrame(tick);
        }

        function triggerStage2Animation() {
            stopAutoPlayAnimation();
            applyTimelineState(0);
            playToTimeline(35, 1150);
        }

        function initHazardBannerDrag() {
            if (hazardBannerDragInitialized) return;
            const banner = document.getElementById('hazard-floating-banner');
            const handle = document.getElementById('hazard-banner-drag-handle');
            if (!banner || !handle) return;
            hazardBannerDragInitialized = true;

            let dragging = false;
            let offsetX = 0, offsetY = 0;

            handle.addEventListener('pointerdown', (e) => {
                dragging = true;
                const rect = banner.getBoundingClientRect();
                // Convert from centered transform to explicit pixel coordinates on first drag
                banner.style.transform = 'none';
                banner.style.left = `${rect.left}px`;
                banner.style.top = `${rect.top}px`;
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                handle.setPointerCapture(e.pointerId);
                e.stopPropagation();
            });

            handle.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const maxX = window.innerWidth - 80;
                const maxY = window.innerHeight - 60;
                const nx = Math.max(8, Math.min(maxX, e.clientX - offsetX));
                const ny = Math.max(8, Math.min(maxY, e.clientY - offsetY));
                banner.style.left = `${nx}px`;
                banner.style.top = `${ny}px`;
            });

            handle.addEventListener('pointerup', (e) => {
                dragging = false;
                try { handle.releasePointerCapture(e.pointerId); } catch (_) {}
            });
        }

        function clickFdiTooth(fdi) {
            selectedCustomFdi = fdi;
            if (!customSingleSubTypes[fdi]) {
                customSingleSubTypes[fdi] = 'crown';
            }
            if (activeBrush === 'cycle') {
                const order = [
                    'normal',
                    'abutment',
                    'pontic',
                    'implant',
                    'rpd_pontic',
                    'rpd_clasp',
                    'extract',
                    'missing_only'
                ];
                const cur = customArch[fdi] || 'normal';
                const nextIdx = (order.indexOf(cur) + 1) % order.length;
                customArch[fdi] = order[nextIdx];
            } else {
                customArch[fdi] = (customArch[fdi] === activeBrush && activeBrush !== 'normal') ? 'normal' : activeBrush;
            }
            if (archPoses[fdi] && archPoses[fdi].isUpper && activeJawView === 'lower') {
                setJawView('both');
            } else if (archPoses[fdi] && !archPoses[fdi].isUpper && activeJawView === 'upper') {
                setJawView('both');
            }
            refreshAdvancedSummaryText();
            renderFdiGrid();
            rebuildScene();
        }

        let planToastTimer = null;
        function showPlanToast(msg, isError = false) {
            const el = document.getElementById('plan-toast-msg');
            if (!el) return;
            el.textContent = msg;
            el.className = isError
                ? 'text-[10px] text-rose-300 bg-rose-950/90 border border-rose-500/40 rounded-lg px-2 py-1 mb-1.5 text-center font-semibold'
                : 'text-[10px] text-emerald-300 bg-emerald-950/90 border border-emerald-500/40 rounded-lg px-2 py-1 mb-1.5 text-center font-semibold';
            el.classList.remove('hidden');
            if (planToastTimer) clearTimeout(planToastTimer);
            planToastTimer = setTimeout(() => {
                el.classList.add('hidden');
            }, 2600);
        }

        function persistSavedPlans() {
            try {
                localStorage.setItem('prostho_saved_plans_v5', JSON.stringify(savedPlans));
            } catch (e) {}
        }

        function buildCurrentPlanSnapshot(customName) {
            const miss = parseInt(document.getElementById('stat-missing-count').textContent) || 0;
            const grind = parseInt(document.getElementById('stat-grind-count').textContent) || 0;
            const wear = parseInt(document.getElementById('stat-wear-count').textContent) || 0;
            const imp = parseInt(document.getElementById('stat-implant-count').textContent) || 0;

            const defaultName = `方案${savedPlans.length + 1} (缺${miss}磨${grind}戴${wear}${imp > 0 ? '种' + imp : ''})`;
            return {
                id: Date.now() + Math.floor(Math.random() * 1000),
                name: (customName && customName.trim()) ? customName.trim() : defaultName,
                arch: { ...customArch },
                subTypes: { ...customSingleSubTypes },
                showCariesLesion,
                jawView: activeJawView,
                singleSubType,
                bridgeConnectorType,
                rpdClaspType,
                materialMode
            };
        }

        function saveCurrentCustomPlan() {
            const inputEl = document.getElementById('custom-plan-name-input');
            const customName = inputEl ? inputEl.value.trim() : '';
            const planSnapshot = buildCurrentPlanSnapshot(customName);
            savedPlans.push(planSnapshot);
            if (inputEl) inputEl.value = '';
            persistSavedPlans();
            renderSavedPlansList();
            showPlanToast(`已保存：${planSnapshot.name}`);
        }

        function startRenameSavedPlan(id, ev) {
            if (ev) ev.stopPropagation();

            setTimeout(() => {
                const inp = document.getElementById(`rename-input-${id}`);
                if (inp) {
                    inp.focus();
                    inp.select();

            }, 20);
        }

        function confirmRenameSavedPlan(id, ev) {
            if (ev) ev.stopPropagation();
            const inp = document.getElementById(`rename-input-${id}`);
            const found = savedPlans.find(p => p.id === id);
            if (found && inp) {
                const newName = inp.value.trim();
                if (newName) {
                    found.name = newName;
                    persistSavedPlans();
                    showPlanToast(`已重命名为：${newName}`);
                }

            editingPlanId = null;
            renderSavedPlansList();
        }

        function cancelRenameSavedPlan(ev) {
            if (ev) ev.stopPropagation();

            renderSavedPlansList();

        function triggerJsonDownload(dataObj, filename) {
            const jsonStr = JSON.stringify(dataObj, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportSingleSavedPlan(id, ev) {
            if (ev) ev.stopPropagation();
            const found = savedPlans.find(p => p.id === id);
            if (!found) return;
            const safeName = (found.name || '口腔修复方案').replace(/[\\/:*?"<>|]/g, '_');
            const payload = {
                app: 'ProsthoMaster3D',
                version: '6.0',
                exportedAt: new Date().toISOString(),
                plans: [found]
            };
            triggerJsonDownload(payload, `${safeName}.json`);
            showPlanToast(`已导出：${found.name}.json`);
        }

        function exportAllSavedPlans() {
            let plansToExport = savedPlans;
            if (plansToExport.length === 0) {
                const currentSnap = buildCurrentPlanSnapshot('当前自定义修复方案');
                plansToExport = [currentSnap];
            }
            const payload = {
                app: 'ProsthoMaster3D',
                version: '6.0',
                exportedAt: new Date().toISOString(),
                plans: plansToExport
            };
            const fileLabel = plansToExport.length === 1
                ? (plansToExport[0].name || '口腔修复方案').replace(/[\\/:*?"<>|]/g, '_')
                : `口腔修复方案集_${plansToExport.length}套`;
            triggerJsonDownload(payload, `${fileLabel}.json`);
            showPlanToast(`已导出 ${plansToExport.length} 套方案文件`);
        }

        function importPlansFromFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    let incomingList = [];
                    if (Array.isArray(parsed)) {
                        incomingList = parsed;
                    } else if (parsed && Array.isArray(parsed.plans)) {
                        incomingList = parsed.plans;
                    } else if (parsed && parsed.arch) {
                        incomingList = [parsed];
                    }

                    const validPlans = incomingList.filter(item => item && typeof item.arch === 'object');
                    if (validPlans.length === 0) {
                        showPlanToast('导入失败：文件格式不正确', true);
                        return;
                    }

                    let lastImported = null;
                    validPlans.forEach((p, idx) => {
                        const cleanArch = {};
                        const cleanSubTypes = {};
                        ARCH_FDI.forEach(fdi => {
                            cleanArch[fdi] = p.arch[fdi] || 'normal';
                            cleanSubTypes[fdi] = (p.subTypes && p.subTypes[fdi]) ? p.subTypes[fdi] : 'crown';
                        });
                        const newPlan = {
                            id: Date.now() + idx + Math.floor(Math.random() * 10000),
                            name: (p.name && String(p.name).trim()) ? String(p.name).trim() : `导入方案 ${savedPlans.length + 1}`,
                            arch: cleanArch,
                            subTypes: cleanSubTypes,
                            showCariesLesion: typeof p.showCariesLesion === 'boolean' ? p.showCariesLesion : true,
                            jawView: p.jawView || 'both',
                            singleSubType: p.singleSubType || 'crown',
                            bridgeConnectorType: p.bridgeConnectorType || 'rigid',
                            rpdClaspType: p.rpdClaspType || 'three_arm',
                            materialMode: p.materialMode || 'ceramic'
                        };
                        savedPlans.push(newPlan);
                        lastImported = newPlan;
                    });

                    persistSavedPlans();
                    renderSavedPlansList();
                    if (lastImported) {
                        loadSavedPlan(lastImported.id);
                    }
                    showPlanToast(`成功导入并加载 ${validPlans.length} 套方案`);
                } catch (err) {
                    showPlanToast('解析方案文件失败，请确认是有效的 JSON 文件', true);
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file, 'utf-8');
        }

        function loadSavedPlan(id) {
            const found = savedPlans.find(p => p.id === id);
            if (!found) return;
            ARCH_FDI.forEach(fdi => {
                customArch[fdi] = found.arch[fdi] || 'normal';
                customSingleSubTypes[fdi] = (found.subTypes && found.subTypes[fdi]) ? found.subTypes[fdi] : 'crown';
            });
            if (typeof found.showCariesLesion === 'boolean') {
                showCariesLesion = found.showCariesLesion;
                const btn = document.getElementById('btn-caries-toggle');
                if (btn) {
                    btn.textContent = showCariesLesion ? '显示龋坏: 开启' : '显示龋坏: 关闭';
                }
            }
            singleSubType = found.singleSubType || 'crown';
            bridgeConnectorType = found.bridgeConnectorType || 'rigid';
            rpdClaspType = found.rpdClaspType || 'three_arm';
            materialMode = found.materialMode || 'ceramic';
            setJawView(found.jawView || 'lower');
            refreshAdvancedSummaryText();
            renderFdiGrid();
            rebuildScene();
        }

        function deleteSavedPlan(id, ev) {
            if (ev) ev.stopPropagation();
            savedPlans = savedPlans.filter(p => p.id !== id);
            persistSavedPlans();
            renderSavedPlansList();
        }

        function clearAllSavedPlans() {
            savedPlans = [];
            try {
                localStorage.removeItem('prostho_saved_plans_v5');
            } catch (e) {}
            renderSavedPlansList();
        }

        function renderSavedPlansList() {
            const box = document.getElementById('saved-plans-list');
            const clearBtn = document.getElementById('btn-clear-all-plans');
            if (!box) return;
            box.innerHTML = '';

            if (clearBtn) {
                clearBtn.classList.toggle('hidden', savedPlans.length === 0);
            }

            if (savedPlans.length === 0) {
                box.innerHTML = `<div class="text-[10px] text-slate-500 text-center py-1 bg-slate-900/50 rounded-lg border border-slate-800/60">暂无已保存方案，可保存或导入他人方案</div>`;
                return;
            }

            savedPlans.forEach(p => {
                const item = document.createElement('div');
                item.className = 'cad-btn px-2 py-1.5 rounded-xl bg-slate-800/90 hover:bg-slate-700/90 border border-teal-500/30 text-sky-100 text-[11px] font-semibold flex items-center justify-between gap-1 cursor-pointer';

                if (editingPlanId === p.id) {
                    item.onclick = (e) => e.stopPropagation();
                    item.innerHTML = `
                        <input id="rename-input-${p.id}" type="text" class="flex-1 min-w-0 bg-slate-950 border border-teal-400 rounded-lg px-1.5 py-0.5 text-[11px] text-white outline-none" onkeydown="if(event.key==='Enter') confirmRenameSavedPlan(${p.id}, event); else if(event.key==='Escape') cancelRenameSavedPlan(event);">
                        <div class="flex items-center gap-1 shrink-0">
                            <button onclick="confirmRenameSavedPlan(${p.id}, event)" class="px-1.5 py-0.5 rounded-md bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-bold" title="确认修改">
                                <i class="fa-solid fa-check"></i>
                            </button>
                            <button onclick="cancelRenameSavedPlan(event)" class="px-1.5 py-0.5 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-300 text-[10px]" title="取消">
                                <i class="fa-solid fa-xmark"></i>
                            </button>
                        </div>`;
                    box.appendChild(item);
                    const inp = item.querySelector(`#rename-input-${p.id}`);
                    if (inp) inp.value = p.name;
                    return;
                }

                item.onclick = () => loadSavedPlan(p.id);

                const leftSpan = document.createElement('span');
                leftSpan.className = 'truncate flex items-center gap-1.5 flex-1 min-w-0';
                leftSpan.title = `点击加载：${p.name}`;
                leftSpan.innerHTML = `<i class="fa-solid fa-bookmark text-teal-400 text-[10px] shrink-0"></i>`;
                const nameText = document.createElement('span');
                nameText.className = 'truncate';
                nameText.textContent = p.name;
                leftSpan.appendChild(nameText);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'flex items-center gap-1 shrink-0';
                actionsDiv.innerHTML = `
                    <button onclick="startRenameSavedPlan(${p.id}, event)" class="px-1.5 py-0.5 rounded-md bg-amber-500/20 hover:bg-amber-500 text-amber-300 hover:text-slate-950 text-[10px] font-bold transition-colors" title="重命名此方案">
                        <i class="fa-solid fa-pen text-[9px]"></i>
                    </button>
                    <button onclick="exportSingleSavedPlan(${p.id}, event)" class="px-1.5 py-0.5 rounded-md bg-sky-500/20 hover:bg-sky-500 text-sky-300 hover:text-white text-[10px] font-bold transition-colors" title="单独导出此方案为文件">
                        <i class="fa-solid fa-download text-[9px]"></i>
                    </button>
                    <button onclick="deleteSavedPlan(${p.id}, event)" class="px-1.5 py-0.5 rounded-md bg-rose-500/20 hover:bg-rose-500 text-rose-300 hover:text-white text-[10px] font-bold transition-colors" title="删除该方案">
                        <i class="fa-solid fa-trash-can text-[9px]"></i>
                    </button>`;

                item.appendChild(leftSpan);
                item.appendChild(actionsDiv);
                box.appendChild(item);
            });
        }

        function renderFdiGrid() {
            const container = document.getElementById('fdi-grid-container');
            if (!container) return;
            container.innerHTML = '';

            const styleMap = {
                normal: 'bg-slate-800/90 text-amber-100 border-slate-700',
                abutment: 'bg-amber-500 text-slate-950 border-amber-300 font-bold',
                pontic: 'bg-sky-500 text-white border-sky-300 font-bold',
                implant: 'bg-emerald-600 text-white border-emerald-300 font-bold',
                rpd_pontic: 'bg-pink-600 text-white border-pink-300 font-bold',
                rpd_clasp: 'bg-purple-600 text-white border-purple-300 font-bold',
                extract: 'bg-orange-600 text-white border-orange-300 font-bold',
                missing_only: 'bg-rose-900/90 text-rose-200 border-rose-500 font-bold',
                complete_unit: 'bg-rose-600 text-white border-rose-300 font-bold'
            };
            const labelMap = {
                normal: '真牙',
                abutment: '磨基牙',
                pontic: '桥体冠',
                implant: '种植牙',
                rpd_pontic: '活动牙',
                rpd_clasp: '挂卡环',
                extract: '待拔牙',
                missing_only: '单纯缺',
                complete_unit: '全口牙'
            };

            const rowsConfig = [
                { label: '上颌', order: [17,16,15,14,13,12,11, 21,22,23,24,25,26,27] },
                { label: '下颌', order: [47,46,45,44,43,42,41, 31,32,33,34,35,36,37] }
            ];

            rowsConfig.forEach(rowInfo => {
                const wrap = document.createElement('div');
                wrap.className = 'flex items-center gap-1.5';

                const tag = document.createElement('span');
                tag.className = 'text-[10px] font-bold text-slate-400 w-7 shrink-0 text-right';
                tag.textContent = rowInfo.label;
                wrap.appendChild(tag);

                const rowEl = document.createElement('div');
                rowEl.className = 'grid gap-1 flex-1';
                rowEl.style.gridTemplateColumns = 'repeat(14, minmax(0, 1fr))';

                rowInfo.order.forEach(fdi => {
                    const r = customArch[fdi] || 'normal';
                    const sub = customSingleSubTypes[fdi] || 'crown';
                    const subTagMap = { crown: '全冠', post_core: '桩核冠', veneer: '贴面', inlay: '嵌体' };
                    const roleText = (r === 'abutment') ? subTagMap[sub] : labelMap[r];
                    const isSel = (fdi === selectedCustomFdi);
                    const btn = document.createElement('button');
                    btn.className = `fdi-cell py-1 px-0.5 rounded-lg border text-[10px] flex flex-col items-center leading-tight ${styleMap[r]} ${isSel ? 'ring-2 ring-white' : ''}`;
                    btn.onclick = () => clickFdiTooth(fdi);
                    btn.innerHTML = `<span>${fdi}</span><span class="text-[9px] opacity-95">${roleText}</span>`;
                    rowEl.appendChild(btn);
                });

                wrap.appendChild(rowEl);
                container.appendChild(wrap);
            });
        }

        function updateCamera() {
            if (!camera) return;
            camSphere.phi = Math.max(0.18, Math.min(Math.PI - 0.18, camSphere.phi));
            camSphere.radius = Math.max(4.2, Math.min(18.0, camSphere.radius));
            camera.position.x = camSphere.target.x + camSphere.radius * Math.sin(camSphere.phi) * Math.sin(camSphere.theta);
            camera.position.y = camSphere.target.y + camSphere.radius * Math.cos(camSphere.phi);
            camera.position.z = camSphere.target.z + camSphere.radius * Math.sin(camSphere.phi) * Math.cos(camSphere.theta);
            camera.lookAt(camSphere.target);
            updateFdi3DLabelsScreenPosition();
        }

        function toggleMobileDrawer(force) {
            const shouldOpen = (typeof force === 'boolean') ? force : !document.body.classList.contains('drawer-open');
            document.body.classList.toggle('drawer-open', shouldOpen);
        }

        function initApp() {
            computeTightContactArchPoses();

            const container = document.getElementById('viewport-3d');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(36, window.innerWidth / window.innerHeight, 0.1, 100);
            updateCamera();

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.88;
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            const envMap = createStudioEnvMap(renderer);
            scene.environment = envMap;
            initDentalMaterials(envMap);

            scene.add(new THREE.AmbientLight(0xffffff, 0.45));
            const keyLight = new THREE.DirectionalLight(0xfffbeb, 0.95);
            keyLight.position.set(5, 12, 9);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.48);
            fillLight.position.set(-7, 6, 6);
            scene.add(fillLight);

            const rimLight = new THREE.DirectionalLight(0xfda4af, 0.35);
            rimLight.position.set(0, 5, -9);
            scene.add(rimLight);

            rootGroup = new THREE.Group();
            scene.add(rootGroup);

            const dom = renderer.domElement;
            dom.style.touchAction = 'none';

            // Touch state: mobile pinch-to-zoom + multi-touch rotation guard
            let activeTouchCount = 0;
            let pinchStartDist = 0;
            let pinchStartRadius = 0;

            dom.addEventListener('pointerdown', e => {
                if (activeTouchCount > 1) { isPointerDown = false; return; }
                isPointerDown = true;
                startXY.x = e.clientX;
                startXY.y = e.clientY;
            });
            window.addEventListener('pointermove', e => {
                if (!isPointerDown || activeTouchCount > 1) return;
                camSphere.theta -= (e.clientX - startXY.x) * 0.0075;
                camSphere.phi -= (e.clientY - startXY.y) * 0.0075;
                startXY.x = e.clientX;
                startXY.y = e.clientY;
                updateCamera();
            });
            window.addEventListener('pointerup', e => {
                if (!isPointerDown) return;
                isPointerDown = false;
                if (allow3DToothClick && Math.hypot(e.clientX - startXY.x, e.clientY - startXY.y) < 5) {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const hits = raycaster.intersectObjects(clickableMeshes, true);
                    if (hits.length > 0) {
                        let o = hits[0].object;
                        while (o && !o.userData.fdi) o = o.parent;
                        if (o && o.userData.fdi) {
                            if (currentMainMode !== 'custom') selectMainMode('custom');
                            clickFdiTooth(o.userData.fdi);
                        }
                    }
                }
            });
            dom.addEventListener('wheel', e => {
                e.preventDefault();
                camSphere.radius += e.deltaY * 0.006;
                updateCamera();
            }, { passive: false });

            // Mobile: two-finger pinch to zoom; single-finger drag still rotates
            dom.addEventListener('touchstart', e => {
                activeTouchCount = e.touches.length;
                if (e.touches.length >= 2) {
                    isPointerDown = false;
                    pinchStartDist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    pinchStartRadius = camSphere.radius;
                }
            }, { passive: false });
            dom.addEventListener('touchmove', e => {
                activeTouchCount = e.touches.length;
                if (e.touches.length >= 2 && pinchStartDist > 0) {
                    e.preventDefault();
                    const dist = Math.hypot(
                        e.touches[0].clientX - e.touches[1].clientX,
                        e.touches[0].clientY - e.touches[1].clientY
                    );
                    if (dist > 1) {
                        camSphere.radius = pinchStartRadius * (pinchStartDist / dist);
                        updateCamera();
                    }
                }
            }, { passive: false });
            const handleTouchEnd = e => {
                activeTouchCount = e.touches.length;
                if (e.touches.length < 2) pinchStartDist = 0;
            };
            dom.addEventListener('touchend', handleTouchEnd);
            dom.addEventListener('touchcancel', handleTouchEnd);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                updateFdi3DLabelsScreenPosition();
            });

            customArch[35] = 'abutment';
            customArch[36] = 'pontic';
            customArch[37] = 'abutment';
            try {
                const raw = localStorage.getItem('prostho_saved_plans_v5');
                if (raw) savedPlans = JSON.parse(raw) || [];
            } catch (e) {}
            renderSavedPlansList();
            renderFdiGrid();

            selectMainMode('bridge');

            function renderLoop() {
                requestAnimationFrame(renderLoop);
                updateFdi3DLabelsScreenPosition();
                renderer.render(scene, camera);
            }
            renderLoop();
        }

        window.onload = initApp;
    </script>
</body>
